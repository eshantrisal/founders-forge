<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Founder's Forge — Comic Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1117; --paper:#f4ecd8; --ink:#1c1c1c; --panel:#161d27; --border:#2c3a4d;
    --text:#e9eef4; --muted:#8b99a9; --accent:#f0a132; --green:#3ecf8e;
    --red:#ef5e5e; --blue:#5aa6f0; --purple:#a98df0; --teal:#46c8c8; --amber:#e8c547;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Patrick Hand',cursive;background:
    radial-gradient(circle at 20% 10%, #131b28 0%, #0d1117 60%);
    color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:18px}
  .app{width:100%;max-width:760px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  h1{font-family:'Bangers',cursive;font-size:30px;letter-spacing:2px;text-shadow:3px 3px 0 #000}
  h1 span{color:var(--accent)}
  .pill{background:var(--panel);border:2px solid var(--border);padding:4px 14px;border-radius:18px;font-size:13px;color:var(--muted)}
  .sndbtn{background:var(--panel);border:2px solid var(--border);border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:17px;color:var(--text)}

  /* KPI + board */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:8px}
  .kpi{background:var(--panel);border:2px solid var(--border);border-radius:10px;padding:8px 12px}
  .kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .kpi .val{font-size:18px}
  .bar{height:5px;background:#0a0e13;border-radius:3px;margin-top:5px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px;transition:width .6s ease}
  .delta{font-size:12px;margin-left:5px}
  .up{color:var(--green)} .down{color:var(--red)}
  .sqdcm{background:var(--panel);border:2px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:14px}
  .board-title{font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:7px;display:flex;justify-content:space-between;text-transform:uppercase}
  .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  .tile{border-radius:9px;padding:8px 4px;text-align:center;border:2px solid var(--border);background:#1f2937;transition:all .4s}
  .tile .letter{font-family:'Bangers',cursive;font-size:24px;line-height:1}
  .tile .tname{font-size:10px;color:var(--muted)}
  .tile .tval{font-size:14px;margin-top:2px}
  .tile.green{border-color:#2a5a4a;background:#13261f}.tile.green .letter{color:var(--green)}
  .tile.amber{border-color:#5a512a;background:#262213}.tile.amber .letter{color:var(--amber)}
  .tile.red{border-color:#5a2a2a;background:#261313}.tile.red .letter{color:var(--red)}
  .tile.locked{opacity:.3}
  .flash{animation:pulse .8s}
  @keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}

  /* COMIC PANEL */
  .panel{background:var(--paper);color:var(--ink);border:4px solid #000;border-radius:6px;margin-bottom:18px;
    box-shadow:8px 8px 0 rgba(0,0,0,.55);overflow:hidden;animation:panelIn .5s cubic-bezier(.2,1.4,.4,1);position:relative}
  .panel.tilt1{transform:rotate(-.5deg)} .panel.tilt2{transform:rotate(.5deg)}
  @keyframes panelIn{from{opacity:0;transform:scale(.92) rotate(-1.5deg)}to{opacity:1}}
  .art{width:100%;display:block;background:#efe5cd;border-bottom:3px solid #000}
  .panel .inner{padding:18px 22px 22px}
  .caption{background:#ffe9a8;border:2px solid #000;padding:7px 12px;font-size:16px;line-height:1.45;
    box-shadow:3px 3px 0 rgba(0,0,0,.3);margin:-34px 14px 14px;position:relative;transform:rotate(-.6deg)}
  .caption.mid{margin-top:0}
  /* speech bubbles */
  .bubble{background:#fff;border:2.5px solid #000;border-radius:16px;padding:9px 14px;font-size:16px;line-height:1.4;
    max-width:82%;margin:10px 0;position:relative;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
  .bubble::after{content:"";position:absolute;bottom:-12px;left:26px;border:7px solid transparent;border-top-color:#000}
  .bubble::before{content:"";position:absolute;bottom:-8px;left:28px;border:5px solid transparent;border-top-color:#fff;z-index:1}
  .bubble.r{margin-left:auto}
  .bubble.r::after{left:auto;right:26px}.bubble.r::before{left:auto;right:28px}
  .bubble .who{font-family:'Bangers',cursive;font-size:12px;letter-spacing:1px;color:#b3530a;display:block}
  .bubble.shout{border-width:3.5px;background:#fff3f0;transform:rotate(-1deg)}
  .thought{border-style:dashed;border-radius:24px;background:#f2f7ff}
  /* choices */
  .choices{display:grid;gap:9px;margin-top:14px}
  .choice{font-family:'Patrick Hand',cursive;background:#fff;border:3px solid #000;border-radius:8px;padding:11px 14px;cursor:pointer;
    text-align:left;font-size:16px;line-height:1.35;box-shadow:4px 4px 0 rgba(0,0,0,.4);transition:transform .12s,box-shadow .12s;color:var(--ink)}
  .choice:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 rgba(0,0,0,.45);background:#fff8e0}
  .choice b{font-family:'Bangers',cursive;letter-spacing:1px;font-weight:400;color:#b3530a;margin-right:6px}
  .btn{font-family:'Bangers',cursive;background:var(--accent);color:#1a1205;border:3px solid #000;border-radius:8px;
    padding:10px 30px;font-size:19px;letter-spacing:1px;cursor:pointer;box-shadow:4px 4px 0 rgba(0,0,0,.4);transition:transform .12s}
  .btn:hover{transform:translate(-2px,-2px)}
  .btn:disabled{opacity:.4;cursor:default}
  /* effects + fact */
  .effects{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;font-size:15px}
  .effects span{background:#fff;border:2px solid #000;border-radius:14px;padding:2px 11px;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
  .effects .up{color:#0a7d4d}.effects .down{color:#c22}
  .fact{background:#e8f1ff;border:2px solid #000;border-left:8px solid var(--blue);padding:9px 13px;margin:12px 0;font-size:14.5px;line-height:1.5;transform:rotate(.4deg);box-shadow:3px 3px 0 rgba(0,0,0,.25)}
  .fact b{font-family:'Bangers',cursive;letter-spacing:1px;color:#1c4f9c;display:block;font-size:13px}
  /* BAM overlay */
  .bam{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) rotate(-8deg) scale(0);
    font-family:'Bangers',cursive;font-size:84px;color:var(--accent);-webkit-text-stroke:3px #000;
    text-shadow:6px 6px 0 #000;z-index:99;pointer-events:none;animation:bam .9s forwards}
  .bam.badbam{color:var(--red)}
  @keyframes bam{0%{transform:translate(-50%,-50%) rotate(-8deg) scale(0)}45%{transform:translate(-50%,-50%) rotate(-4deg) scale(1.25)}65%{transform:translate(-50%,-50%) rotate(-6deg) scale(1)}100%{transform:translate(-50%,-50%) rotate(-6deg) scale(1);opacity:0}}
  .shake{animation:shake .5s}
  @keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-2px)}}
  /* chapter splash */
  .splash{text-align:center;background:
    repeating-linear-gradient(45deg,#f4ecd8,#f4ecd8 14px,#efe5cd 14px,#efe5cd 28px)}
  .splash .chnum{font-family:'Bangers',cursive;font-size:15px;letter-spacing:5px;color:#b3530a;margin-top:16px}
  .splash .chname{font-family:'Bangers',cursive;font-size:52px;letter-spacing:3px;color:var(--ink);
    -webkit-text-stroke:1px #000;text-shadow:4px 4px 0 var(--accent);animation:zoomIn .7s cubic-bezier(.2,1.6,.4,1)}
  .splash .year{font-size:14px;letter-spacing:3px;color:#666;margin-bottom:8px}
  .splash .hook{font-size:18px;font-style:italic;color:#7a3b00;max-width:520px;margin:6px auto 14px;line-height:1.45}
  @keyframes zoomIn{from{transform:scale(.3) rotate(-5deg);opacity:0}to{transform:scale(1)}}
  .unlock{background:#dff5e8;border:2px solid #000;border-left:8px solid var(--green);padding:9px 13px;margin:0 18px 16px;font-size:14.5px;line-height:1.5;text-align:left;box-shadow:3px 3px 0 rgba(0,0,0,.25)}
  /* event card */
  .event-flag{font-family:'Bangers',cursive;display:inline-block;background:var(--red);color:#fff;border:3px solid #000;
    padding:4px 16px;font-size:18px;letter-spacing:2px;transform:rotate(-2deg);box-shadow:3px 3px 0 #000;margin-bottom:10px}
  /* onboarding */
  .ob label{font-family:'Bangers',cursive;display:block;font-size:14px;letter-spacing:1px;color:#7a3b00;margin:14px 0 6px}
  .ob input[type=text]{width:100%;background:#fff;border:3px solid #000;border-radius:8px;padding:10px 13px;font-size:17px;font-family:'Patrick Hand',cursive;outline:none;box-shadow:3px 3px 0 rgba(0,0,0,.3)}
  .optrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
  .opt{font-family:'Patrick Hand',cursive;background:#fff;border:2.5px solid #000;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:14.5px;text-align:center;line-height:1.3;box-shadow:2px 2px 0 rgba(0,0,0,.3);color:var(--ink)}
  .opt.sel{background:var(--accent);transform:translate(-1px,-1px);box-shadow:4px 4px 0 rgba(0,0,0,.4)}
  .diff-badge{font-family:'Bangers',cursive;display:inline-block;border:3px solid #000;border-radius:8px;padding:6px 22px;font-size:22px;letter-spacing:2px;margin:10px 0;box-shadow:4px 4px 0 rgba(0,0,0,.4);transform:rotate(-1deg)}
  .diff-badge.easy{background:#bdf0d4;color:#0a5d38}.diff-badge.normal{background:#ffe9a8;color:#7a5a00}.diff-badge.hard{background:#ffc9c2;color:#8c1d10}
  /* report */
  .rowm{display:grid;grid-template-columns:110px 1fr 78px;gap:10px;align-items:center;font-size:14px;padding:7px 0;border-bottom:2px dotted #999}
  .mname{font-family:'Bangers',cursive;font-size:12px;letter-spacing:1px;color:#7a3b00}
  .dual{position:relative;height:10px;background:#ddd;border:1.5px solid #000;border-radius:5px;overflow:hidden}
  .dual .was{position:absolute;height:100%;background:#a9a294}
  .dual .now{position:absolute;height:100%;transition:width .8s ease}
  .verdict{font-style:italic;color:#7a3b00;margin:14px 0;line-height:1.5;font-size:16px}
  .timeline .row{display:flex;gap:12px;font-size:14px;padding:6px 0;border-bottom:2px dotted #999}
  .timeline .ch{font-family:'Bangers',cursive;color:#b3530a;min-width:80px;font-size:12px;letter-spacing:1px;padding-top:3px}
  /* svg animations */
  .rainfall{animation:rainfall 1s linear infinite}
  @keyframes rainfall{from{transform:translateY(-10px)}to{transform:translateY(14px)}}
  .spin{transform-origin:center;transform-box:fill-box;animation:spin 3s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .smoke{animation:smoke 3s ease-in-out infinite}
  @keyframes smoke{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:.8;transform:translateY(-5px)}}
  .bob{animation:bob 3.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-5px) rotate(.8deg)}}
  .pulse2{transform-origin:center;transform-box:fill-box;animation:pulse2 1.8s ease-in-out infinite}
  @keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
  .blink{animation:blink 1.4s steps(2) infinite}
  @keyframes blink{50%{opacity:.15}}
  .drift{animation:drift 5s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
  @media(max-width:560px){.tiles{gap:4px}.tile .tname{display:none}.splash .chname{font-size:38px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>FOUNDER'S <span>FORGE</span></h1>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="pill" id="pill">Issue #0</div>
      <button class="sndbtn" id="sndbtn" onclick="toggleSound()">🔊</button>
    </div>
  </header>
  <div class="kpis" id="kpis"></div>
  <div id="sqdcmWrap"></div>
  <div id="stage"></div>
</div>

<script>
// ================= SOUND (WebAudio, no files) =================
let AC=null, soundOn=true;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended")AC.resume(); return AC; }
function toggleSound(){ soundOn=!soundOn; document.getElementById("sndbtn").textContent=soundOn?"🔊":"🔇"; if(soundOn)blip(660,.06,.05); }
function tone(freq,dur,type="square",vol=.08,when=0,slide=0){
  if(!soundOn)return; const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,a.currentTime+when);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),a.currentTime+when+dur);
  g.gain.setValueAtTime(vol,a.currentTime+when);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+when+dur);
  o.connect(g);g.connect(a.destination);o.start(a.currentTime+when);o.stop(a.currentTime+when+dur+.05);
}
function noise(dur,vol=.12,when=0){
  if(!soundOn)return; const a=ac(),len=a.sampleRate*dur,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource(),g=a.createGain();s.buffer=buf;
  g.gain.setValueAtTime(vol,a.currentTime+when);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+when+dur);
  s.connect(g);g.connect(a.destination);s.start(a.currentTime+when);
}
const blip=(f,d,v)=>tone(f,d,"square",v);
const SFX={
  click:()=>blip(520,.05,.05),
  choose:()=>{noise(.12,.1);tone(180,.12,"square",.09)},
  good:()=>{tone(523,.09,"square",.07);tone(659,.09,"square",.07,.08);tone(784,.18,"square",.08,.16)},
  bad:()=>{tone(220,.2,"sawtooth",.09,0,-120);tone(110,.35,"sawtooth",.08,.1,-40);noise(.25,.07,.05)},
  chapter:()=>{tone(98,.7,"sawtooth",.1,0,-30);tone(196,.5,"square",.06,.1);noise(.4,.12,.05);tone(392,.3,"triangle",.07,.35)},
  unlock:()=>{tone(880,.1,"triangle",.08);tone(1175,.12,"triangle",.08,.1);tone(1568,.22,"triangle",.09,.22)},
  event:()=>{tone(440,.1,"square",.1);tone(415,.1,"square",.1,.12);tone(440,.1,"square",.1,.24);noise(.2,.1,.36)},
  gameover:()=>{tone(392,.4,"sawtooth",.1,0,-100);tone(311,.4,"sawtooth",.1,.35,-80);tone(233,.9,"sawtooth",.12,.7,-60)}
};

// ================= ART (animated sketches) =================
const S='stroke="#33414f" stroke-width="2.5" fill="none" stroke-linecap="round"';
const SA='stroke="#c46a10" stroke-width="2.5" fill="none" stroke-linecap="round"';
const SD='stroke="#7d8a96" stroke-width="1.8" fill="none" stroke-linecap="round"';
function svg(inner){return `<svg class="art" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;}
const ART={
rain_drive:svg(`
  <rect x="60" y="40" width="34" height="62" ${SD}/><rect x="100" y="25" width="40" height="77" ${SD}/><rect x="146" y="50" width="30" height="52" ${SD}/>
  <g class="bob"><path d="M250 105 q5 -18 28 -18 q8 -12 30 -12 q22 0 28 12 q22 2 24 18 z" ${S}/>
  <circle cx="270" cy="107" r="7" ${S}/><circle cx="330" cy="107" r="7" ${S}/></g>
  <g class="rainfall"><path d="M70 15 l-6 14 M110 8 l-6 14 M160 20 l-6 14 M210 10 l-6 14 M250 22 l-6 14 M310 12 l-6 14 M350 25 l-6 14 M30 30 l-6 14" ${SD}/></g>
  <path d="M30 112 h350" ${SD}/>
`),
workshop_gate:svg(`
  <path d="M50 120 L50 50 L200 25 L350 50 L350 120" ${S}/>
  <path d="M90 120 L90 65 L310 65 L310 120" ${S}/>
  <path d="M90 75 h220 M90 87 h220 M90 99 h220 M90 111 h220" ${SD}/>
  <g class="bob"><rect x="240" y="35" width="70" height="22" ${SA}/>
  <text x="248" y="51" fill="#c46a10" font-size="11" font-family="monospace">FOR SALE</text></g>
  <g class="smoke"><path d="M140 40 q4 -8 10 -2 q6 6 -2 9" ${SD}/></g>
  <path d="M30 120 h340" ${SD}/>
`),
old_lathe:svg(`
  <rect x="80" y="70" width="240" height="35" rx="4" ${S}/>
  <rect x="100" y="50" width="45" height="22" ${S}/>
  <g class="spin"><circle cx="160" cy="61" r="11" ${S}/><path d="M160 50 v6 M160 66 v6 M149 61 h6 M165 61 h6" ${SA}/></g>
  <path d="M171 61 h60" ${SA}/>
  <rect x="231" y="52" width="26" height="18" ${S}/>
  <path d="M95 105 v18 M305 105 v18" ${S}/>
  <g class="smoke"><path d="M120 38 q3 -10 -2 -16 M132 40 q5 -8 1 -18" ${SD}/></g>
  <path d="M40 123 h320" ${SD}/>
`),
moonlight:svg(`
  <circle cx="330" cy="35" r="16" ${SD}/>
  <rect x="70" y="75" width="150" height="8" ${S}/>
  <path d="M85 83 v35 M205 83 v35" ${S}/>
  <g class="blink"><path d="M110 75 v-20 q0 -10 12 -10 q12 0 12 10" ${SA}/><path d="M122 58 l14 16 h-28 z" ${SA}/></g>
  <circle cx="260" cy="60" r="14" ${S}/><g class="spin" style="animation-duration:8s"><path d="M260 52 v8 l6 4" ${S}/></g>
  <path d="M40 120 h320" ${SD}/>
`),
first_order:svg(`
  <rect x="90" y="30" width="130" height="90" ${S}/>
  <circle cx="155" cy="62" r="20" ${SD}/><path d="M155 42 v40 M135 62 h40" ${SD}/>
  <path d="M100 95 h45 m-45 10 h60" ${SD}/>
  <g class="bob"><path d="M250 90 q20 -25 55 -12" ${SA}/><path d="M250 95 h60 l-6 18 h-48 z" ${S}/></g>
  <text x="240" y="50" fill="#33414f" font-size="11" font-family="monospace">±0.02mm</text>
  <path d="M40 123 h320" ${SD}/>
`),
inspection:svg(`
  <g class="pulse2"><path d="M120 70 a30 30 0 1 1 18 28" ${S}/><circle cx="150" cy="70" r="6" ${SA}/></g>
  <path d="M138 98 l30 24" ${S}/>
  <rect x="230" y="55" width="80" height="26" rx="13" ${S}/>
  <g class="blink"><path d="M230 100 l8 8 14 -16 M270 100 l8 8 14 -16" ${SA}/></g>
  <path d="M40 123 h320" ${SD}/>
`),
visitor:svg(`
  <circle cx="140" cy="45" r="12" ${S}/><path d="M140 57 v35 M140 65 l-18 14 M140 65 l18 14 M140 92 l-12 26 M140 92 l12 26" ${S}/>
  <circle cx="240" cy="45" r="12" ${S}/><path d="M228 38 q12 -10 24 0" ${SA}/>
  <path d="M240 57 v35 M240 65 l-18 14 M240 65 l20 10 M240 92 l-12 26 M240 92 l12 26" ${S}/>
  <g class="bob"><rect x="258" y="70" width="22" height="16" ${SD}/></g>
  <path d="M158 79 h64" ${SD} stroke-dasharray="4 4"/>
  <path d="M40 123 h320" ${SD}/>
`),
hiring:svg(`
  <circle cx="110" cy="50" r="11" ${S}/><path d="M110 61 v30 M110 68 l-14 12 M110 68 l14 12 M110 91 l-10 24 M110 91 l10 24" ${S}/>
  <g class="bob"><circle cx="200" cy="50" r="11" ${SA}/><path d="M200 61 v30 M200 68 l-14 12 M200 68 l14 12 M200 91 l-10 24 M200 91 l10 24" ${SA}/></g>
  <circle cx="290" cy="50" r="11" ${S}/><path d="M290 61 v30 M290 68 l-14 12 M290 68 l14 12 M290 91 l-10 24 M290 91 l10 24" ${S}/>
  <path d="M40 123 h320" ${SD}/>
`),
rush:svg(`
  <g class="pulse2"><circle cx="90" cy="55" r="22" ${S}/><path d="M90 40 v15 l10 7" ${SA}/></g>
  <rect x="170" y="70" width="28" height="22" ${S}/><rect x="202" y="70" width="28" height="22" ${S}/><rect x="186" y="46" width="28" height="22" ${S}/>
  <g class="drift"><path d="M270 92 h60 v-22 h-38 l-10 -14 h-12 z" ${S}/>
  <circle cx="284" cy="96" r="7" ${S}/><circle cx="318" cy="96" r="7" ${S}/></g>
  <path d="M250 70 h12 m-18 10 h12 m-6 10 h12" ${SA}/>
  <path d="M40 123 h320" ${SD}/>
`),
factory:svg(`
  <path d="M40 118 V70 l45 -20 v20 l45 -20 v20 l45 -20 v68" ${S}/>
  <path d="M175 118 V60 h185 v58" ${S}/>
  <rect x="195" y="80" width="30" height="20" ${SD}/><rect x="240" y="80" width="30" height="20" ${SD}/><rect x="285" y="80" width="30" height="20" ${SD}/>
  <rect x="320" y="40" width="14" height="20" ${S}/>
  <g class="smoke"><path d="M324 32 q4 -8 -1 -12 M331 34 q5 -7 1 -14" ${SD}/></g>
  <g class="blink"><path d="M55 90 h18 m-18 12 h18 M100 90 h18 m-18 12 h18" ${SD}/></g>
  <path d="M20 120 h360" ${SD}/>
`),
whiteboard:svg(`

    <div class="inner" style="text-align:center">
      <div class="caption">The forge sizes you up... and shows its working.</div>
      <h2 style="font-family:'Bangers',cursive;font-size:26px;letter-spacing:1px">WELCOME, ${PLAYER.name.toUpperCase()}.</h2>
      <div class="diff-badge ${d.key}">MODE: ${d.name}</div>
      <div style="text-align:left;font-size:14.5px;background:#fff;border:2px solid #000;border-radius:8px;padding:9px 13px;margin:8px 0;box-shadow:3px 3px 0 rgba(0,0,0,.25)">
        <b style="font-family:'Bangers',cursive;letter-spacing:1px">THE MATH:</b><br>
        Identity — ${roleTxt}: <b>+${roleW}</b><br>
        Experience — ${expTxt}: <b>+${expW}</b><br>
        Field — ${fieldTxt}: <b>+${fieldW}</b><br>
        Total <b>${score} / 7</b> &nbsp;→&nbsp; ${score>=5?"5+ = FORGE MASTER":score>=2.5?"2.5–4.5 = OPERATOR":"under 2.5 = APPRENTICE"}
      </div>
      <p style="text-align:left;font-size:16px;line-height:1.5;margin:8px 0">${reason}</p>
      <p style="text-align:left;font-size:15px;color:#555;margin-bottom:14px"><em>${d.desc}</em><br>Start: <b>₹${d.cash}L</b> · <b>${d.resolve} resolve</b> · setbacks ×${d.neg} · wins ×${d.pos}</p>
      <button class="btn" onclick="SFX.chapter();showChapterIntro()">BEGIN ISSUE #1 →</button>
    </div></div>`;
  renderKPIs();
  window.scrollTo({top:0,behavior:"smooth"});
}

function snapshot(){G.snap={founder:{...G.founder},board:{...G.board},fActive:[...G.founderActive],bActive:[...G.boardActive]};}

function showChapterIntro(){
  const ch=CHAPTERS[G.ch];
  $("pill").textContent=ch.pill+" · "+PLAYER.name;
  snapshot();
  if(ch.sqdcmUnlock){ch.sqdcmUnlock.forEach(k=>{if(!G.boardActive.includes(k))G.boardActive.push(k);});SFX.unlock();}
  if(ch.founderUnlock)ch.founderUnlock.forEach(k=>{if(!G.founderActive.includes(k)){G.founderActive.push(k);G.founder[k]=k==="oee"?52:50;}});
  G.boardActive.sort((a,b)=>SQDCM.findIndex(t=>t.key===a)-SQDCM.findIndex(t=>t.key===b));
  renderKPIs();
  stage.innerHTML=`<div class="panel splash">
    ${ART[ch.art]}
    <div class="chnum">${ch.title} · ${ch.year}</div>
    <div class="chname">${ch.head}</div>
    <div class="hook">“${ch.hook}”</div>
    <div style="padding:0 24px 4px"><p style="font-size:16px;line-height:1.55;color:#333;text-align:left;max-width:560px;margin:0 auto 14px">${processText(ch.text)}${G.ch===1&&!G.flags.pawar?" <em>(Mr. Pawar, never hired, still appears at your gate every Friday — unpaid, unstoppable, and usually right.)</em>":""}${G.ch===2&&!G.flags.sunil?" <em>(You eventually found a young tooling head — steady hands, still earning his stripes.)</em>":""}</p></div>
    ${ch.unlock?`<div class="unlock">📊 ${ch.unlock}</div>`:""}
    <div style="padding-bottom:24px"><button class="btn" onclick="SFX.click();nextScene()">OPEN THE PAGE →</button></div>
  </div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}

function maybeEvent(cb){
  // 35% chance of a plot twist from chapter 2 on
  if(G.ch===0||Math.random()>0.35||G.usedEvents.length>=EVENTS.length){cb();return;}
  let pool=EVENTS.map((e,i)=>i).filter(i=>!G.usedEvents.includes(i));
  const idx=pool[Math.floor(Math.random()*pool.length)];
  G.usedEvents.push(idx);
  const ev=EVENTS[idx];
  SFX.event(); bam(ev.flag, ev.snd==="bad");
  const deltas={};
  for(const k in ev.fx){
    const isB=G.boardActive.includes(k),isF=G.founderActive.includes(k);
    if(!isB&&!isF)continue;
    deltas[k]=ev.fx[k];
    if(isB)G.board[k]=clamp(G.board[k]+ev.fx[k]);else G.founder[k]=clamp(G.founder[k]+ev.fx[k]);
  }
  renderKPIs(deltas);
  const fxHtml=Object.entries(deltas).map(([k,d])=>{
    const n=FOUNDER_METRICS[k]?FOUNDER_METRICS[k].name:SQDCM.find(t=>t.key===k).name;
    return `<span class="${d>=0?'up':'down'}">${n} ${d>=0?'+':''}${d}</span>`;}).join("");
  stage.innerHTML=`<div class="panel ${tilt()}">
    ${ART[ev.art]}
    <div class="inner">
      <div class="event-flag">⚡ ${ev.flag}</div>
      <div class="caption mid">${ev.cap}</div>
      <div class="effects">${fxHtml}</div>
      <button class="btn" onclick="SFX.click();(${cb.name})()">AND THEN... →</button>
    </div></div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}

function nextScene(){
  G.sc++;
  const ch=CHAPTERS[G.ch];
  if(G.sc>=ch.scenes.length){chapterReport();return;}
  maybeEvent(renderScene);
}
function renderScene(){
  const ch=CHAPTERS[G.ch],s=ch.scenes[G.sc];
  renderKPIs();
  stage.innerHTML=`<div class="panel ${tilt()}">
    ${ART[s.art]||""}
    <div class="inner">
      <div class="caption">${processText(s.cap)}</div>
      ${bubbles(s.bub)}
      <div class="choices">${s.choices.map((c,i)=>`<button class="choice" onclick="pick(${i})"><b>${c.label}</b>${c.sub||""}</button>`).join("")}</div>
    </div></div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}

function pick(i){
  const ch=CHAPTERS[G.ch],s=ch.scenes[G.sc],c=s.choices[i];
  SFX.choose();
  // set story flags
  FLAG_SETTERS.forEach(([fc,fs,fi,flag])=>{if(G.ch===fc&&G.sc===fs&&i===fi)G.flags[flag]=true;});
  // past choices echo into this one
  let synNote="";
  const fx={...c.fx};
  SYNERGY.forEach(sy=>{
    if(sy.ch===G.ch&&sy.sc===G.sc&&sy.i===i&&
       ((sy.flag&&G.flags[sy.flag])||(sy.flagNot&&!G.flags[sy.flagNot]))){
      for(const k in sy.fx)fx[k]=(fx[k]||0)+sy.fx[k];
      synNote=sy.note;
    }
  });
  const deltas={};let net=0;
  for(const k in fx){
    const isB=G.boardActive.includes(k),isF=G.founderActive.includes(k);
    if(!isB&&!isF)continue;
    const jit=Math.abs(fx[k])>2?Math.floor(Math.random()*3)-1:0;
    const d=Math.round(fx[k]*(fx[k]<0?PLAYER.diff.neg:PLAYER.diff.pos))+jit;
    deltas[k]=d;net+=d;
    if(isB)G.board[k]=clamp(G.board[k]+d);else G.founder[k]=clamp(G.founder[k]+d);
  }
  G.log.push({chapter:ch.pill,choice:c.label.replace(" —","")});
  renderKPIs(deltas);
  const bad=net<0;
  setTimeout(()=>{bad?SFX.bad():SFX.good();
    bam(bad?BADBAMS[Math.floor(Math.random()*BADBAMS.length)]:GOODBAMS[Math.floor(Math.random()*GOODBAMS.length)],bad);},150);
  if(G.founder.cash<=0){gameOver("cash",c);return;}
  if(G.founder.resolve<=0){gameOver("resolve",c);return;}
  const fxHtml=Object.entries(deltas).map(([k,d])=>{
    const n=FOUNDER_METRICS[k]?FOUNDER_METRICS[k].name:SQDCM.find(t=>t.key===k).name;
    return `<span class="${d>=0?'up':'down'}">${n} ${d>=0?'+':''}${d}</span>`;}).join("");
  stage.innerHTML=`<div class="panel ${tilt()}">
    ${ART[s.art]||""}
    <div class="inner">
      <div class="caption">${processText(c.out)}</div>
      <div class="effects">${fxHtml}</div>
      ${synNote?`<div class="fact" style="border-left-color:#c46a10"><b style="color:#b3530a">↩ YOUR PAST CHOICES</b>${synNote}</div>`:""}
      ${s.fact?`<div class="fact"><b>⚙ FORGE FACT</b>${s.fact}</div>`:""}
      <button class="btn" onclick="SFX.click();nextScene()">NEXT PANEL →</button>
    </div></div>`;
}

function chapterReport(){
  const ch=CHAPTERS[G.ch];
  const rows=[];
  const addRow=(name,was,now,color,fmt)=>{
    const d=now-(was===null?now:was);
    const dh=was===null?`<span class="up">NEW!</span>`:`<span class="${d>=0?'up':'down'}">${d>=0?'+':''}${d}</span>`;
    rows.push(`<div class="rowm"><span class="mname">${name}</span>
      <div class="dual"><span class="was" style="width:${was===null?0:was}%"></span><span class="now" style="width:${now}%;background:${color}"></span></div>
      <span>${fmt(now)} ${dh}</span></div>`);
  };
  G.founderActive.forEach(k=>{const m=FOUNDER_METRICS[k];
    addRow(m.name,G.snap.fActive.includes(k)?G.snap.founder[k]:null,G.founder[k],"#c46a10",m.fmt);});
  G.boardActive.forEach(k=>{const t=SQDCM.find(t=>t.key===k);
    addRow(t.key+" · "+t.name,G.snap.bActive.includes(k)?G.snap.board[k]:null,G.board[k],"#2a8c8c",v=>v);});
  const all=[...G.founderActive.filter(k=>G.snap.fActive.includes(k)).map(k=>G.founder[k]-G.snap.founder[k]),
             ...G.boardActive.filter(k=>G.snap.bActive.includes(k)).map(k=>G.board[k]-G.snap.board[k])];
  const net=all.reduce((a,b)=>a+b,0),worst=Math.min(...all,0);
  const verdict=net>=15?`${PLAYER.name}, the chapter ends stronger than it began. Pawar would call that a good month — and Pawar doesn't say that.`
    :net>=0?`You held the line, ${PLAYER.name}. Holding the line while growing is quieter than glory — and rarer.`
    :worst<=-10?`A bruising chapter, ${PLAYER.name}. Something gave way back there. The forge remembers — but it also reheats.`
    :`A costly stretch, ${PLAYER.name}. Every founder has chapters they'd rewrite. The next page is blank.`;
  const isLast=G.ch>=CHAPTERS.length-1;
  SFX.unlock();
  stage.innerHTML=`<div class="panel ${tilt()}">
    <div class="inner">
      <div class="caption">END OF ${ch.pill.split("—")[0].trim().toUpperCase()} — the scoreboard doesn't blink.</div>
      <h2 style="font-family:'Bangers',cursive;font-size:22px;letter-spacing:1px;margin-bottom:4px">WHERE YOU STARTED → WHERE YOU STAND</h2>
      <p style="font-size:13px;color:#777;margin-bottom:6px">grey = chapter start · colour = now</p>
      ${rows.join("")}
      <p class="verdict">${verdict}</p>
      <div style="text-align:center"><button class="btn" onclick="SFX.chapter();advanceChapter()">${isLast?"THE FINAL PAGE →":"NEXT ISSUE →"}</button></div>
    </div></div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}
function advanceChapter(){
  G.ch++;G.sc=-1;
  if(G.ch>=CHAPTERS.length){ending();return;}
  showChapterIntro();
}

function gameOver(why,c){
  SFX.gameover();bam("GAME OVER",true);
  const msg=why==="cash"
    ?"The account hits zero. The bank's letter is polite and final. The machines go to a man who haggles over the lathe Pawar loved."
    :"One morning you can't get out of the car in the parking lot. The body keeps score — and it has called the debt.";
  stage.innerHTML=`<div class="panel ${tilt()}">
    ${ART.workshop_gate}
    <div class="inner">
      <div class="event-flag">■ THE STORY ENDS HERE</div>
      <div class="caption mid">${c.out}</div>
      <p style="font-size:16px;line-height:1.5;margin:10px 0"><em>${msg}</em></p>
      <p style="font-size:16px">But founders are made of restarts, ${PLAYER.name}.</p>
      <div style="text-align:center;margin-top:14px"><button class="btn" onclick="location.reload()">BEGIN AGAIN</button></div>
    </div></div>`;
}

function ending(){
  $("pill").textContent="Final Issue · "+PLAYER.name;
  renderKPIs();
  const allVals=[...G.founderActive.map(k=>G.founder[k]),...G.boardActive.map(k=>G.board[k])];
  const avg=Math.round(allVals.reduce((a,b)=>a+b,0)/allVals.length);
  let title,text;
  if(avg>=72){title="THE LEGEND OF THE FORGE";
    text="Business schools write the case study. The pigeon-filled workshop is preserved at the Nashik plant entrance — shutters, oil stains and all — with a plaque: <em>'Every great factory was once one person's unreasonable decision.'</em> On Friday evenings you still walk a shop floor, picking up a part, feeling the finish, the way Pawar taught you.";}
  else if(avg>=55){title="THE BUILDER";
    text="Not every battle won — but the war, decisively. A global manufacturer stands where a rusty shutter hung. ITI kids now run plants. The truest balance sheet: a few thousand families, three towns, and one industry are different because you got fed up at the right moment.";}
  else{title="THE SURVIVOR";
    text="Harder than the books said, lonelier than anyone warned. But the company stands — scarred, real, yours. Most people never find out what they'd do. You did.";}
  const weak=SQDCM.filter(t=>G.boardActive.includes(t.key)).sort((a,b)=>G.board[a.key]-G.board[b.key])[0];
  SFX.chapter();
  stage.innerHTML=`<div class="panel splash">
    ${ART.legacy}
    <div class="chnum">FINAL ISSUE · ${PLAYER.name.toUpperCase()} · ${PLAYER.diff.name} MODE</div>
    <div class="chname">${title}</div>
    <div class="hook">Overall ${avg}/100 · Weakest tile: ${weak.name} (${G.board[weak.key]})</div>
    <div style="padding:0 26px"><p style="font-size:16px;line-height:1.6;color:#333;text-align:left;max-width:560px;margin:0 auto 16px">${text}</p>
    <div class="timeline" style="max-width:560px;margin:0 auto">${G.log.map(l=>`<div class="row"><span class="ch">${l.chapter.split("—")[0]}</span><span>${l.choice}</span></div>`).join("")}</div></div>
    <div style="padding:18px 0 26px"><button class="btn" onclick="location.reload()">LIVE IT AGAIN</button></div>
  </div>`;
}

// If the intro already collected the profile, skip onboarding and show the verdict
const Q=new URLSearchParams(location.search);
if(Q.has("name")&&Q.has("exp")&&Q.has("field")&&Q.has("role")){
  PLAYER.name=decodeURIComponent(Q.get("name")).slice(0,20)||"Founder";
  OB.exp=Math.min(2,Math.max(0,+Q.get("exp")||0));
  OB.field=Math.min(3,Math.max(0,+Q.get("field")||0));
  OB.role=Math.min(3,Math.max(0,+Q.get("role")||0));
  PLAYER.gender=Q.get("g")||"";
  renderKPIs();
  applyProfile();
}else{
  renderKPIs();
  showOnboarding();
}
</script>
</body>
</html>
