<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Founder's Forge — Phase 2</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1117; --paper:#f4ecd8; --ink:#1c1c1c; --panel:#161d27; --border:#2c3a4d;
    --text:#e9eef4; --muted:#8b99a9; --accent:#f0a132; --green:#3ecf8e;
    --red:#ef5e5e; --blue:#5aa6f0; --purple:#a98df0; --teal:#46c8c8; --amber:#e8c547;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Patrick Hand',cursive;background:
    radial-gradient(circle at 20% 10%, #131b28 0%, #0d1117 60%);
    color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:18px;transition:background .8s}
  .app{width:100%;max-width:760px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  h1{font-family:'Bangers',cursive;font-size:30px;letter-spacing:2px;text-shadow:3px 3px 0 #000}
  h1 span{color:var(--accent)}
  .pill{background:var(--panel);border:2px solid var(--border);padding:4px 14px;border-radius:18px;font-size:13px;color:var(--muted)}
  .sndbtn{background:var(--panel);border:2px solid var(--border);border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:17px;color:var(--text)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:8px}
  .kpi{background:var(--panel);border:2px solid var(--border);border-radius:10px;padding:8px 12px}
  .kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .kpi .val{font-size:18px}
  .bar{height:5px;background:#0a0e13;border-radius:3px;margin-top:5px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px;transition:width .6s ease}
  .delta{font-size:12px;margin-left:5px}
  .up{color:var(--green)} .down{color:var(--red)}
  .sqdcm{background:var(--panel);border:2px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:14px}
  .board-title{font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:7px;display:flex;justify-content:space-between;text-transform:uppercase}
  .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  .tile{border-radius:9px;padding:8px 4px;text-align:center;border:2px solid var(--border);background:#1f2937;transition:all .4s}
  .tile .letter{font-family:'Bangers',cursive;font-size:24px;line-height:1}
  .tile .tname{font-size:10px;color:var(--muted)}
  .tile .tval{font-size:14px;margin-top:2px}
  .tile.green{border-color:#2a5a4a;background:#13261f}.tile.green .letter{color:var(--green)}
  .tile.amber{border-color:#5a512a;background:#262213}.tile.amber .letter{color:var(--amber)}
  .tile.red{border-color:#5a2a2a;background:#261313}.tile.red .letter{color:var(--red)}
  .tile.locked{opacity:.3}
  .flash{animation:pulse .8s}
  @keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}

  .panel{background:var(--paper);color:var(--ink);border:4px solid #000;border-radius:6px;margin-bottom:18px;
    box-shadow:8px 8px 0 rgba(0,0,0,.55);overflow:hidden;animation:panelIn .5s cubic-bezier(.2,1.4,.4,1);position:relative}
  .panel.tilt1{transform:rotate(-.5deg)} .panel.tilt2{transform:rotate(.5deg)}
  @keyframes panelIn{from{opacity:0;transform:scale(.92) rotate(-1.5deg)}to{opacity:1}}
  .art{width:100%;display:block;background:#efe5cd;border-bottom:3px solid #000}
  .panel .inner{padding:18px 22px 22px}
  .caption{background:#ffe9a8;border:2px solid #000;padding:7px 12px;font-size:16px;line-height:1.45;
    box-shadow:3px 3px 0 rgba(0,0,0,.3);margin:-34px 14px 14px;position:relative;transform:rotate(-.6deg)}
  .caption.mid{margin-top:0}
  .bubble{background:#fff;border:2.5px solid #000;border-radius:16px;padding:9px 14px;font-size:16px;line-height:1.4;
    max-width:82%;margin:10px 0;position:relative;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
  .bubble::after{content:"";position:absolute;bottom:-12px;left:26px;border:7px solid transparent;border-top-color:#000}
  .bubble::before{content:"";position:absolute;bottom:-8px;left:28px;border:5px solid transparent;border-top-color:#fff;z-index:1}
  .bubble.r{margin-left:auto}
  .bubble.r::after{left:auto;right:26px}.bubble.r::before{left:auto;right:28px}
  .bubble .who{font-family:'Bangers',cursive;font-size:12px;letter-spacing:1px;color:#b3530a;display:block}
  .bubble.shout{border-width:3.5px;background:#fff3f0;transform:rotate(-1deg)}
  .thought{border-style:dashed;border-radius:24px;background:#f2f7ff}
  .choices{display:grid;gap:9px;margin-top:14px}
  .choice{font-family:'Patrick Hand',cursive;background:#fff;border:3px solid #000;border-radius:8px;padding:11px 14px;cursor:pointer;
    text-align:left;font-size:16px;line-height:1.35;box-shadow:4px 4px 0 rgba(0,0,0,.4);transition:transform .12s,box-shadow .12s;color:var(--ink)}
  .choice:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 rgba(0,0,0,.45);background:#fff8e0}
  .choice b{font-family:'Bangers',cursive;letter-spacing:1px;font-weight:400;color:#b3530a;margin-right:6px}
  .btn{font-family:'Bangers',cursive;background:var(--accent);color:#1a1205;border:3px solid #000;border-radius:8px;
    padding:10px 30px;font-size:19px;letter-spacing:1px;cursor:pointer;box-shadow:4px 4px 0 rgba(0,0,0,.4);transition:transform .12s}
  .btn:hover{transform:translate(-2px,-2px)}
  .btn:disabled{opacity:.4;cursor:default}
  .effects{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;font-size:15px}
  .effects span{background:#fff;border:2px solid #000;border-radius:14px;padding:2px 11px;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
  .effects .up{color:#0a7d4d}.effects .down{color:#c22}
  .fact{background:#e8f1ff;border:2px solid #000;border-left:8px solid var(--blue);padding:9px 13px;margin:12px 0;font-size:14.5px;line-height:1.5;transform:rotate(.4deg);box-shadow:3px 3px 0 rgba(0,0,0,.25)}
  .fact b{font-family:'Bangers',cursive;letter-spacing:1px;color:#1c4f9c;display:block;font-size:13px}
  .bam{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) rotate(-8deg) scale(0);
    font-family:'Bangers',cursive;font-size:84px;color:var(--accent);-webkit-text-stroke:3px #000;
    text-shadow:6px 6px 0 #000;z-index:99;pointer-events:none;animation:bam .9s forwards}
  .bam.badbam{color:var(--red)}
  @keyframes bam{0%{transform:translate(-50%,-50%) rotate(-8deg) scale(0)}45%{transform:translate(-50%,-50%) rotate(-4deg) scale(1.25)}65%{transform:translate(-50%,-50%) rotate(-6deg) scale(1)}100%{transform:translate(-50%,-50%) rotate(-6deg) scale(1);opacity:0}}
  .shake{animation:shake .5s}
  @keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-2px)}}
  .splash{text-align:center;background:
    repeating-linear-gradient(45deg,#f4ecd8,#f4ecd8 14px,#efe5cd 14px,#efe5cd 28px)}
  .splash .chnum{font-family:'Bangers',cursive;font-size:15px;letter-spacing:5px;color:#b3530a;margin-top:16px}
  .splash .chname{font-family:'Bangers',cursive;font-size:52px;letter-spacing:3px;color:var(--ink);
    -webkit-text-stroke:1px #000;text-shadow:4px 4px 0 var(--accent);animation:zoomIn .7s cubic-bezier(.2,1.6,.4,1)}
  .splash .year{font-size:14px;letter-spacing:3px;color:#666;margin-bottom:8px}
  .splash .hook{font-size:18px;font-style:italic;color:#7a3b00;max-width:520px;margin:6px auto 14px;line-height:1.45}
  @keyframes zoomIn{from{transform:scale(.3) rotate(-5deg);opacity:0}to{transform:scale(1)}}
  .unlock{background:#dff5e8;color:#143226;border:2px solid #000;border-left:8px solid var(--green);padding:9px 13px;margin:0 18px 16px;font-size:14.5px;line-height:1.5;text-align:left;box-shadow:3px 3px 0 rgba(0,0,0,.25)}
  .event-flag{font-family:'Bangers',cursive;display:inline-block;background:var(--red);color:#fff;border:3px solid #000;
    padding:4px 16px;font-size:18px;letter-spacing:2px;transform:rotate(-2deg);box-shadow:3px 3px 0 #000;margin-bottom:10px}
  .event-flag.bfly{background:#6a3df0}
  .ob label{font-family:'Bangers',cursive;display:block;font-size:14px;letter-spacing:1px;color:#7a3b00;margin:14px 0 6px}
  .ob input[type=text]{width:100%;background:#fff;border:3px solid #000;border-radius:8px;padding:10px 13px;font-size:17px;font-family:'Patrick Hand',cursive;outline:none;box-shadow:3px 3px 0 rgba(0,0,0,.3)}
  .optrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
  .opt{font-family:'Patrick Hand',cursive;background:#fff;border:2.5px solid #000;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:14.5px;text-align:center;line-height:1.3;box-shadow:2px 2px 0 rgba(0,0,0,.3);color:var(--ink)}
  .opt.sel{background:var(--accent);transform:translate(-1px,-1px);box-shadow:4px 4px 0 rgba(0,0,0,.4)}
  .diff-badge{font-family:'Bangers',cursive;display:inline-block;border:3px solid #000;border-radius:8px;padding:6px 22px;font-size:22px;letter-spacing:2px;margin:10px 0;box-shadow:4px 4px 0 rgba(0,0,0,.4);transform:rotate(-1deg)}
  .diff-badge.easy{background:#bdf0d4;color:#0a5d38}.diff-badge.normal{background:#ffe9a8;color:#7a5a00}.diff-badge.hard{background:#ffc9c2;color:#8c1d10}
  .rowm{display:grid;grid-template-columns:110px 1fr 78px;gap:10px;align-items:center;font-size:14px;padding:7px 0;border-bottom:2px dotted #999}
  .mname{font-family:'Bangers',cursive;font-size:12px;letter-spacing:1px;color:#7a3b00}
  .dual{position:relative;height:10px;background:#ddd;border:1.5px solid #000;border-radius:5px;overflow:hidden}
  .dual .was{position:absolute;height:100%;background:#a9a294}
  .dual .now{position:absolute;height:100%;transition:width .8s ease}
  .verdict{font-style:italic;color:#7a3b00;margin:14px 0;line-height:1.5;font-size:16px}
  .timeline .row{display:flex;gap:12px;font-size:14px;padding:6px 0;border-bottom:2px dotted #999}
  .timeline .ch{font-family:'Bangers',cursive;color:#b3530a;min-width:80px;font-size:12px;letter-spacing:1px;padding-top:3px}
  .traj{display:grid;gap:6px;margin:12px 0}
  .traj .trow{display:grid;grid-template-columns:96px 1fr 30px;gap:8px;align-items:center;font-size:13px}
  .traj .tname2{font-family:'Bangers',cursive;letter-spacing:1px;font-size:12px;color:#7a3b00}
  .traj .tbar{height:10px;background:#ddd;border:1.5px solid #000;border-radius:5px;overflow:hidden}
  .traj .tbar i{display:block;height:100%}

  /* ======= THE FLOOR (factory sim) ======= */
  .floor-strip{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:14px 6px 6px}
  .station{flex:1;min-width:106px;background:#fff;border:3px solid #000;border-radius:8px;padding:8px;text-align:center;position:relative;box-shadow:3px 3px 0 rgba(0,0,0,.3);transition:border-color .3s}
  .station .sname{font-family:'Bangers',cursive;font-size:13px;letter-spacing:1px}
  .station .srate{font-size:18px;font-weight:bold}
  .station .smeta{font-size:11px;opacity:.7;line-height:1.4}
  .station.bneck{border-color:#c0392b;animation:bneckpulse 1.2s infinite}
  .station.bneck::after{content:"BOTTLENECK";position:absolute;top:-12px;left:50%;transform:translateX(-50%) rotate(-2deg);background:#c0392b;color:#fff;font-family:'Bangers',cursive;font-size:10px;letter-spacing:1px;padding:1px 8px;border:2px solid #000;white-space:nowrap}
  @keyframes bneckpulse{0%,100%{box-shadow:3px 3px 0 rgba(0,0,0,.3)}50%{box-shadow:0 0 14px rgba(192,57,43,.8)}}
  .conn{display:flex;align-items:center;font-size:18px;padding:0 2px;color:#666}
  .upg{margin-top:6px;display:grid;gap:4px}
  .upg button{all:unset;cursor:pointer;border:2px solid #000;border-radius:6px;font-size:11px;padding:3px 4px;background:#ffe9a8;line-height:1.25;box-shadow:1.5px 1.5px 0 rgba(0,0,0,.3);color:#1c1c1c}
  .upg button:hover{background:#ffd86b}
  .upg button:disabled{opacity:.35;cursor:default}
  .upg button.bought{background:#bdf0d4;cursor:default}
  .flowlane{height:18px;margin:0 14px;border:2px dashed #999;border-radius:9px;position:relative;overflow:hidden}
  .flowlane .dot{position:absolute;top:3px;width:9px;height:9px;border-radius:2px;background:#c46a10;border:1.5px solid #000;animation:flowmove linear infinite}
  @keyframes flowmove{from{left:-4%}to{left:101%}}
  .runstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:12px 0}
  .runstat{background:#fff;border:2.5px solid #000;border-radius:8px;padding:8px;text-align:center;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
  .runstat .rl{font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:.65}
  .runstat .rv{font-family:'Bangers',cursive;font-size:22px;letter-spacing:1px}
  .pool{font-family:'Bangers',cursive;letter-spacing:1px;font-size:15px;background:#fff;border:2.5px solid #000;border-radius:8px;display:inline-block;padding:4px 14px;box-shadow:2px 2px 0 rgba(0,0,0,.25);color:#1c1c1c}
  body[data-theme="genz"] .station,body[data-theme="genz"] .runstat,body[data-theme="genz"] .pool{background:#23234a;color:#eaeaff}
  body[data-theme="genz"] .upg button{background:#3a2a5e;color:#eaeaff}
  body[data-theme="genz"] .upg button.bought{background:#0f4636}
  body[data-theme="veteran"] .station,body[data-theme="veteran"] .runstat{background:#fbf6e8}

  /* ======= GENERATION THEMES ======= */
  body[data-theme="genz"]{background:radial-gradient(circle at 20% 10%,#221347 0%,#0a0a16 60%)}
  body[data-theme="genz"] .panel{background:#191932;color:#e8e8ff}
  body[data-theme="genz"] .art{background:#10102a;filter:invert(.92) hue-rotate(190deg)}
  body[data-theme="genz"] .caption{background:#2b1d52;color:#fff;border-color:#ff2d78;box-shadow:3px 3px 0 #ff2d78}
  body[data-theme="genz"] .bubble{background:#23234a;color:#eaeaff}
  body[data-theme="genz"] .bubble::before{border-top-color:#23234a}
  body[data-theme="genz"] .bubble .who{color:#2dffd5}
  body[data-theme="genz"] .bubble.shout{background:#3a1530}
  body[data-theme="genz"] .thought{background:#1c2a4a}
  body[data-theme="genz"] .choice{background:#23234a;color:#eaeaff;border-color:#ff2d78;box-shadow:4px 4px 0 rgba(255,45,120,.45)}
  body[data-theme="genz"] .choice:hover{background:#31315e}
  body[data-theme="genz"] .choice b{color:#2dffd5}
  body[data-theme="genz"] .fact{background:#14233c;color:#cfe2ff}
  body[data-theme="genz"] .splash{background:repeating-linear-gradient(45deg,#191932,#191932 14px,#1f1f3e 14px,#1f1f3e 28px)}
  body[data-theme="genz"] .splash .chname{color:#fff;text-shadow:4px 4px 0 #ff2d78}
  body[data-theme="genz"] .splash .hook{color:#2dffd5}
  body[data-theme="genz"] .splash .year{color:#9a9ac8}
  body[data-theme="genz"] .unlock{background:#0f2e25;color:#c9f5e4}
  body[data-theme="genz"] .verdict{color:#2dffd5}
  body[data-theme="genz"] .mname,body[data-theme="genz"] .traj .tname2{color:#ff7ab0}
  body[data-theme="genz"] .effects span{background:#23234a;color:#eaeaff}
  body[data-theme="genz"] .ob label{color:#2dffd5}
  body[data-theme="genz"] .opt{background:#23234a;color:#eaeaff}

  body[data-theme="veteran"]{background:#9d968a}
  body[data-theme="veteran"] .panel{background:#f3ead2;box-shadow:8px 8px 0 rgba(40,30,10,.5)}
  body[data-theme="veteran"] .art{filter:grayscale(1) sepia(.35) contrast(1.05);background:#ece2c6}
  body[data-theme="veteran"] .caption{background:#efe3bd;border-color:#3a2f1a}
  body[data-theme="veteran"] .bubble{background:#fbf6e8}
  body[data-theme="veteran"] .choice{background:#fbf6e8}
  body[data-theme="veteran"] .fact{background:#e9e4d2;border-left-color:#6b5b35}
  body[data-theme="veteran"] .fact b{color:#5a4a20}
  body[data-theme="veteran"] .splash{background:repeating-linear-gradient(45deg,#f3ead2,#f3ead2 14px,#ece1c2 14px,#ece1c2 28px)}
  body[data-theme="veteran"] .splash .chname{text-shadow:4px 4px 0 #8a7340}
  body[data-theme="veteran"] h1 span{color:#caa64e}

  .term{color:var(--teal);border-bottom:1px dashed var(--teal);cursor:help;position:relative}
  .panel .term{color:#0e7a7a;border-bottom-color:#0e7a7a}
  .term:hover::after{content:attr(data-def);position:absolute;left:0;bottom:130%;background:#0a0e13;border:1px solid var(--border);color:#e9eef4;padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.5;width:260px;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  @media(max-width:560px){.tiles{gap:4px}.tile .tname{display:none}.splash .chname{font-size:38px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>FOUNDER'S <span>FORGE</span> <small style="font-size:13px;-webkit-text-stroke:0;text-shadow:none;color:var(--muted);font-family:'Patrick Hand',cursive">PHASE 2</small></h1>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="pill" id="pill">Issue #0</div>
      <button class="sndbtn" id="sndbtn" onclick="toggleSound()">🔊</button>
    </div>
  </header>
  <div class="kpis" id="kpis"></div>
  <div id="sqdcmWrap"></div>
  <div id="stage"></div>
</div>

<script>
// ================= SOUND =================
let AC=null, soundOn=true;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended")AC.resume(); return AC; }
function toggleSound(){ soundOn=!soundOn; document.getElementById("sndbtn").textContent=soundOn?"🔊":"🔇"; if(soundOn)tone(660,.06,"square",.05); }
function tone(freq,dur,type="square",vol=.08,when=0,slide=0){
  if(!soundOn)return; try{const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,a.currentTime+when);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),a.currentTime+when+dur);
  g.gain.setValueAtTime(vol,a.currentTime+when);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+when+dur);
  o.connect(g);g.connect(a.destination);o.start(a.currentTime+when);o.stop(a.currentTime+when+dur+.05);}catch(e){}
}
function noise(dur,vol=.12,when=0){
  if(!soundOn)return; try{const a=ac(),len=a.sampleRate*dur,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource(),g=a.createGain();s.buffer=buf;
  g.gain.setValueAtTime(vol,a.currentTime+when);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+when+dur);
  s.connect(g);g.connect(a.destination);s.start(a.currentTime+when);}catch(e){}
}
const SFX={
  click:()=>tone(520,.05,"square",.05),
  choose:()=>{noise(.12,.1);tone(180,.12,"square",.09)},
  good:()=>{tone(523,.09,"square",.07);tone(659,.09,"square",.07,.08);tone(784,.18,"square",.08,.16)},
  bad:()=>{tone(220,.2,"sawtooth",.09,0,-120);tone(110,.35,"sawtooth",.08,.1,-40);noise(.25,.07,.05)},
  chapter:()=>{tone(98,.7,"sawtooth",.1,0,-30);tone(196,.5,"square",.06,.1);noise(.4,.12,.05);tone(392,.3,"triangle",.07,.35)},
  unlock:()=>{tone(880,.1,"triangle",.08);tone(1175,.12,"triangle",.08,.1);tone(1568,.22,"triangle",.09,.22)},
  event:()=>{tone(440,.1,"square",.1);tone(415,.1,"square",.1,.12);tone(440,.1,"square",.1,.24);noise(.2,.1,.36)},
  bfly:()=>{tone(740,.12,"triangle",.08);tone(932,.12,"triangle",.08,.12);tone(1244,.26,"triangle",.09,.24)},
  gameover:()=>{tone(392,.4,"sawtooth",.1,0,-100);tone(311,.4,"sawtooth",.1,.35,-80);tone(233,.9,"sawtooth",.12,.7,-60)}
};

// ================= ART =================
const S='stroke="#33414f" stroke-width="2.5" fill="none" stroke-linecap="round"';
const SA='stroke="#c46a10" stroke-width="2.5" fill="none" stroke-linecap="round"';
const SD='stroke="#7d8a96" stroke-width="1.8" fill="none" stroke-linecap="round"';

      {label:"BLITZ —",sub:"12-hour days, inspect at the end.",out:"Day 18: done. Inspection: 61 bad. Frantic rework. You ship day 21 — exhausted, margins shredded, on time.",fx:{cash:+8,resolve:-10,Q:-8,D:+5},t:{R:2}},
      {label:"CHECK AS YOU GO —",sub:"first-piece + check every 20th part.",out:"Drift caught day 6 — a worn insert, swapped in minutes. 500 good sleeves, day 20. Pawar nods. That's a standing ovation.",fx:{cash:+10,resolve:+5,Q:+10,D:+8},t:{D:2}},
      {label:"OUTSOURCE 200 —",sub:"share the load, hedge the risk.",out:"Their parts come back... variable. You re-machine 70 quietly. Your name rides on every part that leaves your gate.",fx:{cash:+4,resolve:-4,Q:-5,D:+10},t:{R:1,V:1}}
    ]},
  { art:"visitor",
    cap:"The sleeves delivered, Deshmukh's quality head visits unannounced. He picks up a part, mics it, and says nothing for a full minute — the longest minute of your year. Then comes an offer four times bigger than your capacity: 2,000 impeller hubs, every month, ongoing. This is the door. Monthly volume.",
    bub:[["QUALITY HEAD","Not bad. We need 2,000 impeller hubs. Monthly. Ongoing."],["QUALITY HEAD","But your shop... is not a factory.","shout"]],
    fact:"Toyota buyers judge a supplier in ten minutes — from the floor, the toilets, and whether workers make eye contact.",
    choices:[
      {label:"SAY YES —",sub:"buy a used CNC on loan. Now.",out:"The loan officer becomes your most-called contact. But monthly revenue now exists — a heartbeat, not a pulse.",fx:{cash:-10,resolve:+6,reputation:+8,D:-5},t:{V:2,R:1}},
      {label:"RAMP UP —",sub:"500 now, 2,000 by month six.",out:"He almost smiles. 'A supplier who knows his limits. Rare.' You get the contract — and survive it.",fx:{cash:+6,resolve:+4,reputation:+10,Q:+5},t:{D:2,P:1}},
      {label:"STAY NICHE —",sub:"high-precision, low volume only.",out:"A niche is a fortress. Margins are lovely. But you've capped your own ceiling — and you know it.",fx:{cash:+8,resolve:-3,reputation:+4,Q:+8},t:{D:1}}
    ]},
  { art:"hiring",
    cap:"The monthly contract means you finally need to hire. Two paths sit across your desk: Sunil, a brilliant machinist who lost his last job for arguing with everyone — and two fresh ITI graduates, eager and blank as new steel. Meanwhile the shop floor is drowning in chips, offcuts and unlabelled bins, and Pawar has started muttering about discipline.",
    bub:[["PAWAR","In Telco we cleaned the machine before going home. A dirty floor hides every problem."]],
    fact:"5S isn't housekeeping — it's diagnosis. Toyota calls cleaning 'inspection': wiping machines daily catches 70% of failures early.",
    choices:[
      {label:"HIRE SUNIL —",sub:"skill now, personality later.",out:"His parts are jewellery. His arguments are war. Pawar threatens to retire. Twice.",fx:{Q:+10,D:+5,resolve:-8},t:{V:1,R:1}},
      {label:"TRAIN THE KIDS —",sub:"Pawar's way, on laminated cards.",out:"Slow for three months... then it clicks. Same way, every time. You've accidentally invented standard work.",fx:{cash:-5,Q:+6,D:+3,resolve:+5,reputation:+3},t:{P:2,D:1}},
      {label:"5S BLITZ FIRST —",sub:"one weekend, whole shop.",out:"Shadow boards up, floor painted, a hidden coolant leak found. Monday feels like a different company.",fx:{Q:+8,D:+6,resolve:+4,cash:-2},t:{D:2}}
    ]},
  { art:"rush",
    cap:"Thursday, 6 PM. The phone rings: Deshmukh's production line is at risk and they need 300 hubs by Monday morning — double your weekly rate, over a weekend. Failing your anchor customer is unthinkable. So is shipping garbage to make a count.",
    bub:[["DESHMUKH GM","Can you do it? Yes or no?","shout"]],
    fact:"An automotive line-stop costs ₹30–80 lakh per HOUR. Suppliers who give honest numbers under pressure become legends.",
    choices:[
      {label:"PROMISE IT —",sub:"all hands, all weekend, you too.",out:"Monday 5 AM: tempo loaded. The GM calls personally. Your team is wrecked — and walking tall.",fx:{D:+12,reputation:+10,resolve:-10},t:{V:1,P:1,R:1}},
      {label:"HONEST NUMBERS —",sub:"200 Monday, rest Tuesday.",out:"'You're the only supplier whose numbers we can plan on.' Trust compounds faster than interest.",fx:{D:+8,reputation:+8,Q:+5,resolve:-3},t:{D:2,P:1}},
      {label:"SKIP INSPECTION —",sub:"make the count. Quietly.",out:"Monday made. Wednesday: 9 oversize bores caught at THEIR line. Formal complaint. The shortcut becomes the longest road.",fx:{D:+5,reputation:-15,Q:-12,cash:-6},t:{R:3}}
    ]}
]},
{ title:"Chapter 3", pill:"Issue #3 — The Factory", year:"YEAR THREE · CHAKAN MIDC", art:"factory",
  head:"THE FACTORY", hook:"You're no longer the bottleneck-fixer. You ARE the bottleneck.",
  text:"A 20,000 sq ft shed. Six CNCs. Forty people. Revenue ₹4 crore. And a new enemy: chaos at scale. Then one morning — an ambulance at the gate.",
  unlock:"The full <b>SQDCM</b> board lights up — and <b>S — SAFETY</b> comes first, because nothing else matters if people get hurt. <b>C — COST</b> joins. And a master number appears: <b>PLANT OEE</b>. Yours: a humbling 52%. World class: 85%.",
  sqdcmUnlock:["S","C","M"], founderUnlock:["oee"],
  scenes:[
  { art:"safety",
    cap:"The ambulance at the gate. A young operator, rushing a job, reached past a missing guard on CNC #3 — eleven stitches across the forearm, and it could have been far worse. Production stops. Everyone gathers. The guard had been missing for a month, and everyone knew.",
    bub:[["PAWAR","In thirty years I saw two men die. Both times, everyone knew the hazard. Both times, production came first.","shout"]],
    fact:"Heinrich's pyramid: every serious injury sits on ~29 minor ones and ~300 near-misses. Near-misses are free warnings — if anyone reports them.",
    choices:[
      {label:"STOP EVERYTHING —",sub:"2-day safety audit, fix every guard.",out:"Customers grumble. But the message lands like a hammer: nothing outranks safety. Near-miss reports start flowing — eleven in a month.",fx:{S:+15,D:-6,M:+10,cash:-5},t:{P:2,D:2}},
      {label:"PATCH & RUN —",sub:"fix #3, brief everyone, keep moving.",out:"Schedule saved. But the floor heard the real message: deliveries outrank fingers. The next hazard won't be reported.",fx:{S:-8,D:+4,M:-8},t:{R:2}},
      {label:"SAFETY CHAMPION —",sub:"the injured man leads the fight.",out:"He runs the morning brief from his bandages. Nobody calls safety 'theatre' when its voice has eleven stitches.",fx:{S:+10,M:+8,cash:-2},t:{P:2,V:1}}
    ]},
  { art:"whiteboard",
    cap:"Pawar's whiteboard tells the ugly truth about your six machines: OEE 52%. Breakdowns eat 11% of running time, changeovers another 9%, waiting-for-material even more. CNC #3 — the bottleneck that sets the pace of the whole plant — died twice this month, both times mid-batch. The bank would prefer you wanted nothing at all.",
    bub:[["SUNIL","Buy a seventh machine!"],["PAWAR","Fix the six you have.","r"]],
    fact:"OEE multiplies: 90% × 80% × 95% = 68%, not 88%. Most unmanaged plants run 40–60% — a free factory hides inside the one you own.",
    choices:[
      {label:"SEVENTH MACHINE —",sub:"capacity solves everything?",out:"It absorbs the load... then idles like the rest, starved by the same chaos. You've automated waiting. OEE: 51%.",fx:{cash:-15,oee:-1,C:-6,M:+3},t:{R:1}},
      {label:"PM + SMED —",sub:"maintain & attack changeovers.",out:"Three unglamorous months. Breakdowns halve. Changeovers: 40 → 14 min. OEE 63%. You found a hidden machine inside your machines.",fx:{cash:-4,oee:+11,Q:+4,C:+8,M:+5},t:{D:3}},
      {label:"CALL CONSULTANTS —",sub:"lean assessment first.",out:"₹6 lakh for a 90-page deck saying what Pawar said free. But the value-stream map changes how you see everything.",fx:{cash:-6,oee:+4,C:+2,reputation:+4},t:{D:1}}
    ]},
  { art:"rush",
    cap:"A fire at a competitor's plant floods you with enquiries — months of revenue, begging to be taken. But your production planning is still a whiteboard and Pawar's memory. Urgent orders jump the queue daily, and every queue-jump makes three other orders late. Delivery has already slipped to 81% and customers are noticing.",
    bub:[["YOU","(The plant doesn't need more orders. It needs a drumbeat.)","thought"]],
    fact:"Little's Law: Lead Time = WIP ÷ Throughput. Overload a plant and it gets slower for EVERYONE. Physics doesn't negotiate.",
    choices:[
      {label:"TAKE IT ALL —",sub:"revenue first, systems later.",out:"Two glorious months. Then the pile-up: Delivery 68%, two customers gone, and Deshmukh issues a vendor warning.",fx:{cash:+15,D:-13,reputation:-8,M:-8,C:+4},t:{R:2,V:1}},
      {label:"TAKE 40% —",sub:"+ weekly frozen schedules.",out:"Saying no to money hurts. But the plant finds a cadence. Delivery rebounds to 90%. Calm is a capability.",fx:{cash:+8,D:+9,oee:+5,M:+6},t:{D:2}},
      {label:"SUBCONTRACT —",sub:"three small shops, audited.",out:"You become what Deshmukh was to you. One gem, one adequate, one... teaches you why incoming inspection exists.",fx:{cash:+10,Q:-6,D:+3,C:+3,reputation:+3},t:{V:1,R:1}}
    ]},
  { art:"canteen",
    cap:"The strike that almost was. New shift timings — announced by a notice on the board, the way big companies do it — land badly. You employ forty people now, and most never knew you in the old workshop days. A worker named Kale has become their voice, and the canteen goes quiet when you enter. Morale is the lowest it has ever been.",
    bub:[["KALE","We're not machines you schedule.","shout"],["PAWAR","Hold firm.","r"]],
    fact:"Across 1,000+ plants, the strongest predictor of defect rates is whether workers believe management listens. Toyota: 'Before we build cars, we build people.'",
    choices:[
      {label:"HOLD FIRM —",sub:"it's an operational necessity.",out:"You win the schedule, lose the room. Resentment hides where you can't see it — in the small extra checks nobody is paid for.",fx:{M:-12,Q:-6,oee:-3},t:{R:1}},
      {label:"OPEN THE BOOKS —",sub:"show why, co-design shifts.",out:"Costs on the canteen wall. Silence... questions... ideas. Kale proposes a better rotation than yours. Trust lands.",fx:{M:+14,oee:+4,resolve:+4},t:{P:3}},
      {label:"PAY A BONUS —",sub:"sweeten the change.",out:"Output rises. So do shortcuts. Bonus-chasing breeds quality drift. What you pay for is exactly what you get.",fx:{M:+5,oee:+5,Q:-7,cash:-5},t:{R:1}}
    ]},
  { art:"kaizen",
    cap:"After the truce, Kale turns out to be full of improvement ideas — and Pawar wants to harness that energy into a proper kaizen program: small daily improvements driven by the floor itself. Meanwhile one stubborn defect, a missed chamfer on a single operation, keeps escaping to customers. A redesigned fixture could make the mistake physically impossible.",
    bub:[["SUNIL","Suggestion boxes are where ideas go to die."],["PAWAR","Then don't build a box. Build a habit.","r"]],
    fact:"Toyota implements ~1 million employee ideas a year. Shigeo Shingo, father of poka-yoke: 'Errors are inevitable. Defects are optional.'",
    choices:[
      {label:"REAL KAIZEN —",sub:"weekly huddles, ideas live in a week.",out:"Month one: trivia. Month three: a 22-year-old's fixture idea saves ₹3 lakh/year. The floor starts owning the plant.",fx:{oee:+7,M:+8,Q:+5,C:+5,cash:-2},t:{P:2,D:2}},
      {label:"JUST POKA-YOKE —",sub:"fix the chamfer, move on.",out:"That defect never escapes again. Clean, surgical. But improvement stays something YOU do to the plant.",fx:{Q:+8,oee:+2},t:{D:1}},
      {label:"CASH PER IDEA —",sub:"pay for suggestions.",out:"A flood — recycled, gamed, occasionally brilliant. Two great fixes emerge. Messy, like most real things.",fx:{oee:+4,M:+4,cash:-5,Q:+3},t:{R:1}}
    ]}
]},
{ title:"Chapter 4", pill:"Issue #4 — The Big League", year:"YEAR SIX · NASHIK", art:"automotive",
  head:"THE BIG LEAGUE", hook:"Quality measured in defects per million. A late truck stops a 2,000-car line.",
  text:"A scout from Mahendra Motors visits unannounced — they always do. Second source, gearbox synchroniser hubs. The prize is huge. The air is thin.",
  unlock:"Same board, thinner air: <b>Q</b> is now scored in <b>PPM</b> — under 50 defects per million. <b>D</b> means a truck at their dock at 6:40 AM sharp. <b>C</b> faces 3–5% price cuts. Every. Single. Year.",
  scenes:[
  { art:"ppap",
    cap:"Mahendra's first hurdle: the PPAP — a documentation mountain proving your process can make their part right, every time, forever. Control plans, capability studies, measurement analysis. Done properly: four months and ₹25 lakh. Or a consultant offers a 'PPAP package' that dresses up your current process in the right paperwork.",
    bub:[["SUNIL","It's bureaucracy."],["PAWAR","It's religion.","r"]],
    fact:"PPAP demands Cpk ≥ 1.67 — your variation must fit the tolerance five times over. Not 'we made 5 good parts' but 'we cannot make a bad one'.",
    choices:[
      {label:"DO IT RIGHT —",sub:"rebuild the process, document truth.",out:"Four brutal months. You find spindle misalignment nobody ever measured. PPAP passes Level 3, first submission. Rare air.",fx:{cash:-20,Q:+12,reputation:+10,oee:+3},t:{D:3}},
      {label:"BUY PAPERWORK —",sub:"approved now, improve later.",out:"Approved on paper. Their auditor finds the gap between document and floor. Rating: amber. Amber fades slowly.",fx:{cash:-8,reputation:-10,Q:-4},t:{R:3}},
      {label:"ASK FOR TIME —",sub:"do it right, slower.",out:"'Second sources that implode help nobody.' Seven months granted. The breathing room saves your team's sanity.",fx:{cash:-14,Q:+10,reputation:+6,M:+4},t:{D:2,P:1}}
    ]},
  { art:"eightd",
    cap:"Week nine of automotive production. Mahendra's incoming inspection flags 3 bad hubs in a lot of 5,000 — that's 600 PPM against a contract limit of 50. The formal 8D complaint lands in your inbox like a court summons. Root cause hides somewhere between a tool-wear pattern and an operator who may have skipped a check. The whole plant is watching how the boss handles the first big failure.",
    bub:[["SQE (MAHENDRA)","Root cause. Seven days. Don't bring us a name — bring us a system.","shout"]],
    fact:"The 8D method (Ford, 1987) and Toyota's '5 Whys' share a creed: ask why five times and 'operator error' becomes a design flaw. Blame kills root cause.",
    choices:[
      {label:"FIND THE CULPRIT —",sub:"accountability must be visible.",out:"A good operator — exhausted from the double shift YOU approved. The firing chills the floor. Problems start hiding.",fx:{M:-12,Q:-5,S:-4,reputation:+2},t:{R:2}},
      {label:"BLAME THE PROCESS —",sub:"why COULD it be skipped?",out:"A poka-yoke gauge the part can't bypass + tool-life tracking. The SQE writes: 'mature quality culture.'",fx:{Q:+12,M:+8,reputation:+8,cash:-4},t:{D:2,P:2}},
      {label:"FIGHT IT —",sub:"3 in 5,000? Measurement uncertainty!",out:"You win the technical debate, lose the relationship. Nobody remembers metrology. Everyone remembers the supplier who argued.",fx:{reputation:-8,resolve:-4},t:{R:2}}
    ]},
  { art:"covid",
    cap:"Then the world stops. A virus with a crown-shaped name empties the roads of Nashik. Lockdown: Mahendra's plant shut, your plant shut, revenue at zero — while salaries, EMIs and rent march on like an army that never sleeps. The burn rate is ₹45 lakh a month, and nobody on earth knows how long this lasts.",
    bub:[["VIKRAM","40% layoffs by Friday. It's arithmetic."],["PAWAR","A factory is not the machines. Lose the people, lose the factory.","r","shout"]],
    fact:"April 2020: Indian auto production hit literally ZERO for the first month ever. Suppliers who kept skilled workers recovered 3–4 months faster than deep-cutters.",
    choices:[
      {label:"NO LAYOFFS —",sub:"your salary to zero, protect every job.",out:"Four months of fear. Then the rebound hits like a flood — and you're the only supplier at full strength. Loyalty was working capital.",fx:{cash:-22,M:+15,reputation:+10,D:+8},t:{P:3,V:1}},
      {label:"CUT 40% —",sub:"survive certain, rebuild later.",out:"You survive comfortably. The rebound finds you short-handed; your machinists now work for rivals. The floor remembers who blinked.",fx:{cash:+8,M:-15,D:-8,Q:-5},t:{D:1,R:1}},
      {label:"PIVOT —",sub:"ventilator parts under emergency orders.",out:"Eighteen-hour days retooling to medical tolerances. Thin margins, frantic certs — but salaries flow, and your team makes the national press.",fx:{cash:-6,reputation:+14,M:+10,oee:-4},t:{V:2,P:1}}
    ]},
  { art:"plant_choice",
    cap:"Recovery brings a bigger question: scale-up needs a whole new plant. Path one — greenfield near Mahendra in Nashik: ₹18 crore, two years of construction, but designed perfectly from day one. Path two — acquire struggling Patil Auto Parts: a ready plant with an IATF certificate, tired machines, and 130 demoralised employees. The bank, for once, will fund either.",
    bub:[["VIKRAM","Buy Patil. Speed wins."],["PAWAR","You can't un-bake a bad cake.","r"]],
    fact:"Layout is destiny: parts in a bad factory travel 10–50× the value-adding distance. You pay for every metre. Forever.",
    choices:[
      {label:"GREENFIELD —",sub:"design the perfect plant.",out:"Two years of capex sweats. Then — a plant that flows like water. 78% OEE in year one. Pawar cries at the opening. 'Dust,' he says.",fx:{cash:-25,oee:+12,Q:+6,S:+6,M:+6},t:{V:2,D:2}},
      {label:"ACQUIRE PATIL —",sub:"speed over perfection.",out:"Day one: revenue, certificate... culture debt. 30 leave, others bloom. Faster, uglier, cheaper. Probably right. Never sure.",fx:{cash:-15,oee:+4,M:-5,reputation:+6,D:+5},t:{V:1,R:1}},
      {label:"SQUEEZE —",sub:"third shift + flow redesign.",out:"40% more from the same walls — the cheapest capacity on earth hides in your own plant. But the ceiling is now visible.",fx:{cash:-5,oee:+9,D:+4,C:+8,M:-3,S:-2},t:{D:2}}
    ]},
  { art:"ev",
    cap:"The EV question. Mahendra announces 30% electric by 2030 — and synchroniser hubs, your bread and butter, simply don't exist inside an EV. Your engineers identify adjacent prizes: e-axle housings, motor shafts, battery frames. All demand new machines, new competencies, and capital you'd rather not bet blind.",
    bub:[["SUNIL","We can be early, on time, or dead.","shout"]],
    fact:"An ICE powertrain: ~2,000 moving parts. An EV drivetrain: ~20. Up to 40% of traditional powertrain supplier revenue is at risk by 2035.",
    choices:[
      {label:"PIVOT HARD —",sub:"full EV line + R&D, now.",out:"Painfully early — 30% load for 18 months. Then orders flood, and you're one of three qualified suppliers in the country.",fx:{cash:-18,reputation:+12,oee:-5,C:-5,resolve:+5},t:{V:3,R:1}},
      {label:"CO-DEVELOP —",sub:"learn on a customer's money.",out:"Motor-shaft development contract: modest revenue, priceless learning. A customer pulls you forward instead of capital pushing you blind.",fx:{cash:-5,reputation:+8,Q:+4},t:{D:1,V:1}},
      {label:"MILK ICE —",sub:"gearboxes outlive hype.",out:"Three fat years. Then rivals announce EV lines, and Mahendra asks for your 'future readiness roadmap'. You don't have one.",fx:{cash:+15,C:+6,reputation:-8,resolve:-5},t:{R:2}}
    ]}
]},
{ title:"Chapter 5", pill:"Issue #5 — The World", year:"YEAR ELEVEN · HANNOVER", art:"globe",
  head:"THE WORLD", hook:"'Indian suppliers promise everything and audit poorly. Convince us you're different.'",
  text:"Three plants. 900 people. ₹220 crore. At Hannover Messe, a German Tier-1 stops at your booth — and stays an hour.",
  unlock:"The global game is the whole board at once. OEE proves competitiveness. PPM earns entry. Delivery across oceans keeps it. And culture? That's what auditors smell in the first ten minutes.",
  scenes:[
  { art:"audit",
    cap:"Brandt's audit is unlike anything you've faced: two days, three German auditors, and your actual shop floor — not your conference room. They interview operators alone. They ask a 23-year-old on line 4 what she does with a suspect part. They time a changeover with their own stopwatch. A week before, Sunil offers to 'prepare' the floor.",
    bub:[["SUNIL","Let me 'prepare' the floor. Banners. Briefing cards."],["YOU","(Do they audit the plant... or the truth?)","thought","r"]],
    fact:"VDA 6.3 auditors are trained to detect 'audit theatre' — they ask the same question three ways, to three people, on two days.",
    choices:[
      {label:"NO THEATRE —",sub:"they see a normal Tuesday.",out:"The operator on line 4 answers from habit, not script: she pulls the andon cord. 89/100. 'The most honest plant we have audited in Asia.'",fx:{reputation:+14,M:+8},t:{P:2,D:1}},
      {label:"PAINT & SCRIPTS —",sub:"first impressions count.",out:"The floor gleams. Then one off-script question, and a rehearsed answer collapses live. 71/100: 'evidence of audit preparation.'",fx:{reputation:-6,M:-4,cash:-3},t:{R:2}},
      {label:"POSTPONE —",sub:"fix the real gaps first.",out:"Six months later you score 92 — and watch a Thai rival take the first program while you were perfecting. Time has a price.",fx:{Q:+8,reputation:+4,cash:-6},t:{D:2}}
    ]},
  { art:"ship",
    cap:"The contract comes: e-axle housings shipped to Brandt's plant in Hungary, 11,000 km away. Delivery now involves the Suez canal's moods, euro exposure, and customs paperwork in two languages. One late vessel could idle their assembly line at €40,000 an hour — and someone would have to pay.",
    bub:[["SUPPLY CHAIN HEAD","Suez moods, euro swings, and a customs officer's lunch schedule. Pick your armour."]],
    fact:"When the Ever Given blocked Suez for 6 days, ~$60 billion in trade stalled and European lines stopped within 10 days.",
    choices:[
      {label:"AIR-FREIGHT VOW —",sub:"any delay risk → fly it. Whatever it costs.",out:"Twice in year one: ₹40 lakh burned in the sky. Brandt never sees a late part — and tells other divisions about you.",fx:{cash:-10,D:+12,C:-6,reputation:+10},t:{V:1,P:1}},
      {label:"HUNGARY BUFFER —",sub:"3 weeks of stock near their plant.",out:"Working capital groans, but deliveries become boring — logistics' highest compliment. The warehouse becomes your European beachhead.",fx:{cash:-12,D:+10,C:-3,oee:+2},t:{D:2}},
      {label:"INCOTERMS SHIELD —",sub:"risk transfers at the Indian port.",out:"Legally elegant. Commercially naive. The first late vessel is 'not your fault' on paper and entirely your fault in the planner's rack.",fx:{cash:+4,D:-8,reputation:-8},t:{R:2}}
    ]},
  { art:"ai",
    cap:"The AI question arrives wearing a hoodie. Your new digital head — poached from a Bengaluru startup — demos her pilot: sensors on CNC #14 predicted a spindle bearing failure nine days before it happened. Now she wants ₹8 crore for the full smart factory: sensors everywhere, AI vision inspection, a digital twin of the whole Nashik plant.",
    bub:[["SUNIL","I've seen 'Industry 4.0' decks since 2015. Most bought dashboards, not results."],["PAWAR","We listened to machines with a screwdriver to the ear. If a computer listens better — let it listen.","r"]],
    fact:"~70% of digital-manufacturing pilots die in 'pilot purgatory'. Winners digitise processes they had ALREADY stabilised. AI on chaos just predicts chaos faster.",
    choices:[
      {label:"FULL SMART FACTORY —",sub:"₹8 crore, every line, two years.",out:"Year one: data swamps, three vendors fired. Year two: the curve bends — vision systems catching 12-PPM defects. Brandt photographs YOUR dashboards.",fx:{cash:-20,oee:+10,Q:+8,C:+6},t:{V:3}},
      {label:"ONE USE-CASE AT A TIME —",sub:"bottleneck machines first.",out:"Unfashionable and effective. Each win funds the next. Three years later: same smart factory, profitably, with the floor's trust.",fx:{cash:-8,oee:+8,Q:+5,M:+4},t:{D:2}},
      {label:"DECLINE —",sub:"machines + skilled people built this.",out:"Two years, nothing bad happens — that's the trap. Then a rival wins a Brandt program on real-time quality data you can't provide.",fx:{cash:+5,reputation:-9,C:-4},t:{R:1}}
    ]},
  { art:"legacy",
    cap:"The endgame question. You are 54. Revenue ₹600 crore, three plants, your parts on three continents. A global private equity fund offers to buy 60% at a valuation that would make your grandfather's toolbox worth its weight in gold. Vikram wants to sell. Pawar, retired, visits on Fridays and says nothing — which, as always, says everything. And your daughter, an engineer, has quietly started attending your management reviews.",
    bub:[["PE PARTNER","What do you want your name to mean?"],["PAWAR","...","r","thought"]],
    fact:"Germany's Mittelstand counts 1,500+ 'hidden champions' owned for generations, not quarters. Japan has 33,000+ companies over a century old.",
    choices:[
      {label:"SELL 60% —",sub:"take the wealth, keep a board seat.",out:"More zeros than your first year's revenue. The company grows. Something else doesn't. Fridays, you and Pawar drink tea and don't talk about it.",fx:{cash:+30,resolve:-5,M:-6},t:{R:1}},
      {label:"100-YEAR COMPANY —",sub:"refuse. Groom the next generation.",out:"Slower wealth, deeper roots. Your daughter starts — at her own insistence — on the Chakan shop floor. Succession IS the strategy.",fx:{resolve:+10,M:+10,reputation:+8},t:{P:2,D:1,V:1}},
      {label:"COUNTER —",sub:"minority stake funds a Mexico plant.",out:"Good assets negotiate. Ground breaks in Monterrey. The buyer of a pigeon-filled workshop now reads OEE across nine time zones before breakfast.",fx:{cash:+15,reputation:+10,oee:+3,resolve:+3},t:{V:2,D:1}}
    ]}
]}];

  {flag:"POWER CUT!",art:"factory",cap:"MIDC grid fails. Four hours dark. The UPS saves the CNC controllers — barely.",fx:{D:-4,C:-3},snd:"bad"},

function pick(i){

  FLAG_SETTERS.forEach(([fc,fs,fi,flag])=>{if(G.ch===fc&&G.sc===fs&&i===fi)G.flags[flag]=true;});
  if(c.t)for(const k in c.t)G.axes[k]+=c.t[k];
  let synNote="";

  SYNERGY.forEach(sy=>{
    if(sy.ch===G.ch&&sy.sc===G.sc&&sy.i===i&&
       ((sy.flag&&G.flags[sy.flag])||(sy.flagNot&&!G.flags[sy.flagNot]))){
      for(const k in sy.fx)fx[k]=(fx[k]||0)+sy.fx[k];

    if(!isB&&!isF)continue;
    const jit=Math.abs(fx[k])>2?Math.floor(Math.random()*3)-1:0;
    const d=Math.round(fx[k]*(fx[k]<0?PLAYER.diff.neg:PLAYER.diff.pos))+jit;
    deltas[k]=d;net+=d;
    if(isB)G.board[k]=clamp(G.board[k]+d);else G.founder[k]=clamp(G.founder[k]+d);
  }

// Goldratt as a game mechanic: throughput = the bottleneck. Upgrade wisely.
const FLOORS=[
  {name:"THE KADAM WORKSHOP",demand:2200,margin:.45,
   stations:[
    {n:"CUT-OFF SAW",r:14,u:.92,q:.98},
    {n:"OLD LATHE",r:9,u:.78,q:.95},
    {n:"DEBURR",r:16,u:.96,q:.99},
    {n:"INSPECT",r:12,u:.9,q:.995}]},
  {name:"WORKSHOP + CNC BAY",demand:3400,margin:.5,
   stations:[
    {n:"SAW",r:18,u:.92,q:.98},
    {n:"CNC TURN",r:13,u:.84,q:.97},
    {n:"MILL",r:11,u:.8,q:.96},
    {n:"DEBURR",r:20,u:.96,q:.99},
    {n:"INSPECT",r:15,u:.9,q:.995}]},
  {name:"CHAKAN PLANT",demand:5200,margin:.55,
   stations:[
    {n:"BLANKING",r:26,u:.9,q:.98},
    {n:"CNC CELL 1",r:18,u:.82,q:.97},
    {n:"CNC CELL 2",r:16,u:.78,q:.96},
    {n:"GRIND",r:21,u:.88,q:.97},
    {n:"WASH",r:30,u:.97,q:.999},
    {n:"FINAL GATE",r:22,u:.92,q:.995}]},
  {name:"NASHIK EV LINE",demand:6800,margin:.6,
   stations:[
    {n:"FORGE FEED",r:32,u:.9,q:.98},
    {n:"5-AXIS CNC",r:24,u:.84,q:.97},
    {n:"ROBOT WELD",r:21,u:.8,q:.96},
    {n:"E-COAT",r:34,u:.94,q:.99},
    {n:"VISION GATE",r:27,u:.93,q:.998}]}
];
// upgrade types: speed +25% rate · pm +10pts uptime · pokayoke quality→99.5%
const UPGS=[["speed","⚡ +25% SPEED","r"],["pm","🔧 PM: +10% UPTIME","u"],["pq","🛡 POKA-YOKE","q"]];
let F=null;

function effRate(s){return s.r*(1+(s.speed?0.25:0))*Math.min(1,(s.u+(s.pm?0.10:0)));}
function stQ(s){return s.pq?Math.max(s.q,0.995):s.q;}
function bneckIdx(){let bi=0,bv=1e9;F.st.forEach((s,i)=>{const e=effRate(s);if(e<bv){bv=e;bi=i;}});return bi;}

function showFloor(){
  const cfg=FLOORS[Math.min(G.ch,FLOORS.length-1)];
  F={cfg,st:cfg.stations.map(s=>({...s})),pool:PLAYER.diff.key==="easy"?4:3,ran:false};
  $("pill").textContent="THE FLOOR · "+PLAYER.name;
  renderFloor();
}
function renderFloor(msg){
  const cfg=F.cfg,bi=bneckIdx();
  const thr=Math.round(effRate(F.st[bi]));
  const qAll=F.st.reduce((a,s)=>a*stQ(s),1);
  const stHtml=F.st.map((s,i)=>{
    const upgBtns=UPGS.map(([k,lab])=>{
      const owned=s[k==="speed"?"speed":k];
      return `<button ${owned?'class="bought"':''} ${(!owned&&F.pool>0&&!F.ran)?"":"disabled"} onclick="buyUpg(${i},'${k}')">${owned?"✓ ":""}${lab}</button>`;
    }).join("");
    return `<div class="station ${i===bi?'bneck':''}">
      <div class="sname">${s.n}</div>
      <div class="srate">${Math.round(effRate(s))}/hr</div>
      <div class="smeta">uptime ${Math.round(Math.min(1,s.u+(s.pm?0.10:0))*100)}% · FTQ ${(stQ(s)*100).toFixed(1)}%</div>
      <div class="upg">${upgBtns}</div>
    </div>${i<F.st.length-1?'<div class="conn">▶</div>':''}`;
  }).join("");
  const dots=Array.from({length:6},(_,i)=>`<span class="dot" style="animation-duration:${(2.6-thr/40).toFixed(2)}s;animation-delay:${(i*.45).toFixed(2)}s"></span>`).join("");
  stage.innerHTML=`<div class="panel ${tilt()}">
    ${ART.factory}
    <div class="inner">
      <div class="caption">⚙ MANAGEMENT INTERLUDE — ${cfg.name}. Demand this quarter: <b>${cfg.demand.toLocaleString()} parts</b>. Your line runs at the speed of its slowest station. Spend your upgrade points... then pull the lever.</div>
      <div style="text-align:center;margin-bottom:4px"><span class="pool">UPGRADE POINTS: ${F.pool}</span></div>
      <div class="floor-strip">${stHtml}</div>
      <div class="flowlane">${dots}</div>
      <div class="runstats">
        <div class="runstat"><div class="rl">Line rate</div><div class="rv">${thr}/hr</div></div>
        <div class="runstat"><div class="rl">Quarter capacity</div><div class="rv">${(thr*250).toLocaleString()}</div></div>
        <div class="runstat"><div class="rl">Demand</div><div class="rv">${cfg.demand.toLocaleString()}</div></div>
        <div class="runstat"><div class="rl">Line FTQ</div><div class="rv">${(qAll*100).toFixed(1)}%</div></div>
      </div>
      ${msg?`<div class="fact" style="border-left-color:#c46a10"><b style="color:#b3530a">⚙ THE FLOOR SPEAKS</b>${msg}</div>`:""}
      <div class="fact"><b>⚙ FORGE FACT</b>Goldratt's Theory of Constraints: an hour lost at the bottleneck is an hour lost for the whole plant — an hour saved anywhere else is a mirage. Watch where the red tag moves when you upgrade.</div>
      <div style="text-align:center"><button class="btn" onclick="runQuarter()">▶ RUN THE QUARTER</button></div>
    </div></div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}
function buyUpg(i,k){
  if(F.pool<=0||F.ran)return;
  const key=k==="speed"?"speed":k;
  if(F.st[i][key])return;
  const wasB=bneckIdx();
  F.st[i][key]=true;F.pool--;
  SFX.unlock();
  const nowB=bneckIdx();
  let msg="";
  if(i===wasB&&nowB!==wasB)msg=`The bottleneck just MOVED — ${F.st[wasB].n} is free, now ${F.st[nowB].n} sets the pace. This is the whole game of factory physics.`;
  else if(i!==wasB)msg=`${F.st[i].n} got better... but ${F.st[wasB].n} still sets the line's pace. Upgrading a non-bottleneck adds capacity nobody can use.`;
  renderFloor(msg);
}
function runQuarter(){
  if(F.ran)return;F.ran=true;
  SFX.chapter();
  const cfg=F.cfg;
  const thr=effRate(F.st[bneckIdx()]);
  const qAll=F.st.reduce((a,s)=>a*stQ(s),1);
  const hours=250;
  const made=Math.round(thr*hours);
  const good=Math.round(made*qAll);
  const shipped=Math.min(good,cfg.demand);
  const otd=Math.min(1,good/cfg.demand);
  // revenue: ₹(margin×1000) per shipped part · fixed cost: 70% of full-demand revenue
  const profit=Math.max(-10,Math.round(shipped*cfg.margin*1000/100000 - cfg.demand*cfg.margin*700/100000));
  // animate counters
  stage.innerHTML=`<div class="panel ${tilt()}">
    ${ART.factory}
    <div class="inner" style="text-align:center">
      <div class="caption mid">THE QUARTER RUNS. Machines hum. Trucks arrive at dawn. Numbers do not lie.</div>
      <div class="runstats">
        <div class="runstat"><div class="rl">Parts made</div><div class="rv" id="cMade">0</div></div>
        <div class="runstat"><div class="rl">Good parts</div><div class="rv" id="cGood">0</div></div>
        <div class="runstat"><div class="rl">Demand met</div><div class="rv" id="cOtd">0%</div></div>
        <div class="runstat"><div class="rl">Profit</div><div class="rv" id="cProf">—</div></div>
      </div>
      <div class="flowlane" style="margin-bottom:14px">${Array.from({length:8},(_,i)=>`<span class="dot" style="animation-duration:1.1s;animation-delay:${(i*.18).toFixed(2)}s"></span>`).join("")}</div>
      <div id="floorDone"></div>
    </div></div>`;
  let t=0;const T=36;
  const iv=setInterval(()=>{
    t++;const f=t/T;
    $("cMade").textContent=Math.round(made*f).toLocaleString();
    $("cGood").textContent=Math.round(good*f).toLocaleString();
    $("cOtd").textContent=Math.round(otd*100*f)+"%";
    if(t%6===0)tone(160+t*8,.05,"square",.04);
    if(t>=T){
      clearInterval(iv);
      $("cProf").textContent=(profit>=0?"+₹":"−₹")+Math.abs(profit)+"L";
      // apply to campaign
      const deltas={cash:profit};
      G.founder.cash=clamp(G.founder.cash+profit);
      if(G.founderActive.includes("oee")){const d=otd>=1?+3:+1;deltas.oee=d;G.founder.oee=clamp(G.founder.oee+d);}
      if(G.boardActive.includes("D")){const d=otd>=1?+5:otd>=.9?+1:-6;deltas.D=d;G.board.D=clamp(G.board.D+d);}
      if(G.boardActive.includes("Q")){const d=qAll>=.985?+4:qAll>=.96?+1:-4;deltas.Q=d;G.board.Q=clamp(G.board.Q+d);}
      if(G.boardActive.includes("C")){const d=profit>=8?+4:profit>=0?+1:-3;deltas.C=d;G.board.C=clamp(G.board.C+d);}
      renderKPIs(deltas);
      profit>=0?SFX.good():SFX.bad();
      bam(profit>=0?"SHIPPED!":"RED INK!",profit<0);
      const verdict=otd>=1&&qAll>=.985?"Full demand, first-time quality, money in the bank. The floor is singing."
        :otd>=1?"Demand met — but the scrap bin is heavier than it should be. Quality is the next constraint."
        :otd>=.9?"Close. The bottleneck choked the last trucks of the quarter. The customer noticed."
        :"Short. Unmet demand walks to your competitor and rarely walks back. The bottleneck owns you until you own it.";
      $("floorDone").innerHTML=`
        <div class="effects" style="justify-content:center">${Object.entries(deltas).map(([k,d])=>{
          const n=FOUNDER_METRICS[k]?FOUNDER_METRICS[k].name:(SQDCM.find(t=>t.key===k)||{}).name||k;
          return `<span class="${d>=0?'up':'down'}">${n} ${d>=0?'+':''}${d}</span>`;}).join("")}</div>
        <p class="verdict">${verdict}</p>
        <button class="btn" onclick="SFX.chapter();advanceChapter()">BACK TO THE STORY →</button>`;
    }
  },90);
}

  OB.exp=Math.min(2,Math.max(0,+Q.get("exp")||0));
  OB.field=Math.min(3,Math.max(0,+Q.get("field")||0));
  OB.role=Math.min(3,Math.max(0,+Q.get("role")||0));
  PLAYER.gender=Q.get("g")||"";
  renderKPIs();
  applyProfile();
}else{
  renderKPIs();
  showOnboarding();
}
</script>
