<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Founder's Forge — A Manufacturing Story</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161d27; --panel2:#1f2937; --border:#2c3a4d;
    --text:#e9eef4; --muted:#8b99a9; --accent:#f0a132; --green:#3ecf8e;
    --red:#ef5e5e; --blue:#5aa6f0; --purple:#a98df0; --teal:#46c8c8; --amber:#e8c547;
    --sketch:#9fb0c0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:20px}
  .app{width:100%;max-width:800px}
  header{text-align:center;margin-bottom:16px}
  h1{font-size:26px;letter-spacing:1px}
  h1 span{color:var(--accent)}
  .chapter-pill{display:inline-block;background:var(--panel);border:1px solid var(--border);padding:5px 16px;border-radius:20px;font-size:12px;color:var(--muted);margin-top:8px;letter-spacing:1px;text-transform:uppercase}

  /* Founder KPIs */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px;animation:fade .5s}
  .kpi .label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px;white-space:nowrap}
  .kpi .val{font-size:17px;font-weight:600}
  .bar{height:5px;background:var(--panel2);border-radius:3px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px;transition:width .6s ease}
  .delta{font-size:11px;margin-left:5px}
  .up{color:var(--green)} .down{color:var(--red)}

  /* SQDCM board */
  .sqdcm{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:16px;animation:fade .6s}
  .sqdcm .board-title{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
  .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .tile{border-radius:10px;padding:10px 6px;text-align:center;border:1px solid var(--border);background:var(--panel2);transition:all .4s}
  .tile .letter{font-size:22px;font-weight:800;line-height:1}
  .tile .tname{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:3px}
  .tile .tval{font-size:13px;font-weight:600;margin-top:4px}
  .tile.green{border-color:#2a5a4a;background:#13261f}.tile.green .letter{color:var(--green)}
  .tile.amber{border-color:#5a512a;background:#262213}.tile.amber .letter{color:var(--amber)}
  .tile.red{border-color:#5a2a2a;background:#261313}.tile.red .letter{color:var(--red)}
  .tile.locked{opacity:.32}.tile.locked .letter{color:var(--muted)}
  .tile .flash{animation:pulse .8s}
  @keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}

  /* Cards & art */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:0;margin-bottom:16px;animation:fade .45s;overflow:hidden}
  .card .inner{padding:24px 26px}
  .art{width:100%;display:block;background:linear-gradient(180deg,#121a24,#161d27);border-bottom:1px solid var(--border)}
  .card h2{font-size:18px;margin-bottom:12px;color:var(--accent)}
  .chapter-title{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--teal);margin-bottom:8px}
  .story{font-size:15px;line-height:1.75;margin-bottom:18px}
  .story em{color:var(--muted)}
  .choices{display:grid;gap:10px}
  .choice{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;text-align:left;color:var(--text);font-size:14px;line-height:1.5;transition:border-color .15s,transform .15s;font-family:inherit}
  .choice:hover{border-color:var(--accent);transform:translateX(4px)}
  .effects{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;font-size:13px}
  .btn{background:var(--accent);color:#1a1205;border:none;border-radius:8px;padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:hover{filter:brightness(1.12)}

  /* Forge fact */
  .fact{background:#101b2a;border:1px solid #234;border-left:3px solid var(--blue);border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:13px;line-height:1.65}
  .fact b{color:var(--blue);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;display:block;margin-bottom:4px}

  /* unlock + terms */
  .unlock{background:#15302a;border:1px solid #2a5a4a;border-radius:10px;padding:12px 16px;margin:0 0 16px;font-size:13px;line-height:1.6}
  .unlock b{color:var(--green)}
  .term{color:var(--teal);border-bottom:1px dashed var(--teal);cursor:help;position:relative}
  .term:hover::after{content:attr(data-def);position:absolute;left:0;bottom:130%;background:#0a0e13;border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.5;width:260px;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.5)}

  /* Dramatic chapter opening */
  .opening{position:relative;text-align:center;padding:0}
  .opening .art{border-bottom:1px solid var(--border)}
  .opening .inner{padding:30px 30px 36px}
  .opening .chnum{font-size:12px;letter-spacing:6px;color:var(--accent);text-transform:uppercase;animation:slideIn 1s}
  .opening .chname{font-size:34px;font-weight:800;letter-spacing:2px;margin:8px 0 4px;animation:slideIn 1.2s}
  .opening .year{font-size:13px;color:var(--muted);letter-spacing:3px;margin-bottom:18px;animation:slideIn 1.4s}
  .opening .hook{font-size:17px;font-style:italic;color:var(--amber);line-height:1.6;max-width:560px;margin:0 auto 18px;animation:slideIn 1.6s}
  .opening p.body{color:var(--muted);line-height:1.75;max-width:580px;margin:0 auto 22px;font-size:15px;text-align:left;animation:slideIn 1.8s}
  @keyframes slideIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  /* Onboarding */
  .ob label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:16px 0 6px}
  .ob input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-size:15px;font-family:inherit;outline:none}
  .ob input[type=text]:focus{border-color:var(--accent)}
  .optrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
  .opt{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:13px;text-align:center;color:var(--text);font-family:inherit;line-height:1.4}
  .opt.sel{border-color:var(--accent);background:#2a2113;color:var(--accent)}
  .diff-badge{display:inline-block;border-radius:20px;padding:6px 18px;font-size:13px;font-weight:700;letter-spacing:1px;margin:8px 0}
  .diff-badge.easy{background:#13261f;color:var(--green);border:1px solid #2a5a4a}
  .diff-badge.normal{background:#262213;color:var(--amber);border:1px solid #5a512a}
  .diff-badge.hard{background:#261313;color:var(--red);border:1px solid #5a2a2a}
  /* Chapter progress report */
  .report .rowm{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px solid var(--panel2)}
  .report .mname{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:1px}
  .dual{position:relative;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .dual .was{position:absolute;height:100%;background:#3a4a5d;border-radius:4px}
  .dual .now{position:absolute;height:100%;border-radius:4px;transition:width .8s ease}
  .verdict{font-style:italic;color:var(--amber);margin:14px 0 18px;line-height:1.6}
  .ending-title{font-size:26px;color:var(--accent);margin-bottom:12px}
  .timeline{margin:18px 0}
  .timeline .row{display:flex;gap:12px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--panel2)}
  .timeline .ch{color:var(--teal);min-width:90px;text-transform:uppercase;font-size:11px;letter-spacing:1px;padding-top:2px}
  .gameover .inner h2{color:var(--red)}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media(max-width:560px){.tiles{gap:5px}.tile .tname{display:none}}
</style>
</head>

// ============ GLOSSARY ============
const TERMS = {
  "lead time":"Total time from receiving an order to delivering it. Customers buy speed as much as price.",
  "rework":"Fixing defective parts after they are made. Pure waste — you pay twice to make the part once.",
  "OEE":"Overall Equipment Effectiveness = Availability × Performance × Quality. The single best measure of how well a plant uses its machines. World-class is ~85%.",
  "downtime":"Time a machine is not producing — breakdowns, changeovers, waiting for material. Every minute is money lost.",
  "takt time":"The rhythm of customer demand: available time ÷ units required. Faster builds excess inventory; slower misses deliveries.",
  "5S":"Sort, Set in order, Shine, Standardise, Sustain — workplace organisation discipline. The foundation of every serious factory.",
  "preventive maintenance":"Servicing machines on schedule before they break. Trades small planned downtime for large unplanned downtime.",
  "PPM":"Defective Parts Per Million shipped. Automotive customers expect under 50 PPM — 99.995% good parts.",
  "PPAP":"Production Part Approval Process — the formal evidence package an automotive customer demands before you may ship a single production part.",
  "poka-yoke":"Mistake-proofing: designing a process so errors are physically impossible (e.g., a fixture that will not accept a part backwards).",
  "kaizen":"Continuous improvement in small daily steps, driven by the people doing the work — not just managers.",
  "OTD":"On-Time Delivery: % of orders delivered on the promised date. In automotive, a missed delivery can stop a customer line.",
  "IATF 16949":"The global quality management standard for automotive suppliers. No certificate, no business.",
  "changeover":"Time lost switching a machine from one part to another. SMED techniques attack this waste.",
  "bottleneck":"The slowest step in a process — it sets the output of the whole plant. An hour lost at the bottleneck is an hour lost forever.",
  "SQDCM":"Safety, Quality, Delivery, Cost, Morale — the five boards on the wall of nearly every serious factory, reviewed daily, in that order. Safety always comes first.",
  "andon":"A signal — light or cord — any worker can trigger to stop the line when something is wrong. Stopping the line to fix problems beats hiding them.",
  "LTIFR":"Lost Time Injury Frequency Rate — injuries causing lost workdays per million hours worked. The number every plant manager reads first."
};
function T(word, key){ const def = TERMS[key] || TERMS[word] || TERMS[word.toLowerCase()] || ""; return `<span class="term" data-def="${def}">${word}</span>`; }

          desc:"The forge is kind to newcomers. Setbacks sting less, wins carry further, and you start with a deeper pocket. Learn the language of the floor."},
  normal:{key:"normal",name:"OPERATOR",   badge:"normal",cash:40, resolve:60, pos:1.0,  neg:1.0,

};

let G = {

  founder:{cash:40, resolve:60, reputation:15},

  boardActive:[],

};
const $=id=>document.getElementById(id);
const stage=$("stage");
const clamp=v=>Math.max(0,Math.min(100,v));
const tileClass=v=> v>=70?"green": v>=45?"amber":"red";

function renderKPIs(deltas={}){
  $("kpis").innerHTML = G.founderActive.map(k=>{
    const m=FOUNDER_METRICS[k], v=G.founder[k], d=deltas[k]||0;
    const dh=d?`<span class="delta ${d>0?'up':'down'}">${d>0?'+':''}${d}</span>`:"";
    return `<div class="kpi"><div class="label">${m.name}</div><div class="val">${m.fmt(v)}${dh}</div><div class="bar"><i style="width:${v}%;background:${m.color}"></i></div></div>`;
  }).join("");
  renderBoard(deltas);
}
function renderBoard(deltas={}){
  if(G.boardActive.length===0){ $("sqdcmWrap").innerHTML=""; return; }
  const tiles = SQDCM.map(t=>{
    const on=G.boardActive.includes(t.key);
    if(!on) return `<div class="tile locked"><div class="letter">${t.key}</div><div class="tname">${t.name}</div><div class="tval">🔒</div></div>`;
    const v=G.board[t.key], d=deltas[t.key]||0;
    const dh=d?`<span class="delta ${d>0?'up':'down'}">${d>0?'+':''}${d}</span>`:"";
    return `<div class="tile ${tileClass(v)}"><div class="letter ${d?'flash':''}">${t.key}</div><div class="tname">${t.name}</div><div class="tval">${v}${dh}</div></div>`;
  }).join("");
  $("sqdcmWrap").innerHTML=`<div class="sqdcm"><div class="board-title"><span>Plant Board · SQDCM</span><span>green ≥70 · amber ≥45 · red &lt;45</span></div><div class="tiles">${tiles}</div></div>`;
}

function obPick(group, idx, btn){
  OB[group]=idx;
  [...btn.parentElement.children].forEach(b=>b.classList.remove("sel"));
  btn.classList.add("sel");

}
function checkObReady(){
  const ok = $("obName").value.trim().length>0 && OB.exp!==null && OB.field!==null && OB.role!==null;
  $("obBtn").disabled=!ok; $("obBtn").style.opacity=ok?1:.4;
}

  stage.innerHTML=`<div class="card ob">
    ${ART.workshop_gate}
    <div class="inner">
      <h2>Who walks into the forge?</h2>

function assignDifficulty(){
  PLAYER.name=$("obName").value.trim();
  PLAYER.exp=OB.exp; PLAYER.field=OB.field; PLAYER.role=OB.role;
  // score: role weighs most, experience second, field nudges
  let score = [3,2,1,0][OB.role] + [0,1,2][OB.exp] + (OB.field===0?1:0);
  PLAYER.diff = score>=4 ? DIFFS.hard : score>=2 ? DIFFS.normal : DIFFS.easy;
  G.founder.cash=PLAYER.diff.cash; G.founder.resolve=PLAYER.diff.resolve;
  const d=PLAYER.diff;
  const reason = d.key==="hard" ? "You carry experience and you claim leadership — so the forge will treat you like a leader. No training wheels."
    : d.key==="normal" ? "You know how things run. The forge will deal with you plainly — fair, but never soft."
    : "Everyone starts somewhere — even Soichiro Honda started in a shack. The forge will teach before it tests.";
  stage.innerHTML=`<div class="card">
    ${ART.old_lathe}
    <div class="inner" style="text-align:center">
      <h2>Welcome, ${PLAYER.name}.</h2>
      <div class="diff-badge ${d.badge}">MODE: ${d.name}</div>
      <p class="story" style="text-align:left">${reason}</p>
      <p class="story" style="text-align:left"><em>${d.desc}</em></p>
      <p class="story" style="text-align:left">Starting position: <b>₹${d.cash}L cash</b> · <b>${d.resolve} resolve</b> · consequences ×${d.neg} on setbacks, ×${d.pos} on wins.</p>
      <button class="btn" onclick="showChapterIntro()">Begin the Story →</button>
    </div></div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}

function snapshot(){
  G.snap={founder:{...G.founder}, board:{...G.board},
          fActive:[...G.founderActive], bActive:[...G.boardActive]};
}

function showChapterIntro(){
  const ch=CHAPTERS[G.ch];
  $("pill").textContent=ch.pill+" · "+PLAYER.name+" · "+PLAYER.diff.name;
  snapshot();
  if(ch.sqdcmUnlock) ch.sqdcmUnlock.forEach(k=>{if(!G.boardActive.includes(k))G.boardActive.push(k);});
  if(ch.founderUnlock) ch.founderUnlock.forEach(k=>{
    if(!G.founderActive.includes(k)){G.founderActive.push(k); G.founder[k]= k==="oee"?52:50;}
  });
  // keep canonical SQDCM order
  G.boardActive.sort((a,b)=>SQDCM.findIndex(t=>t.key===a)-SQDCM.findIndex(t=>t.key===b));
  renderKPIs();
  stage.innerHTML=`<div class="card opening">
    ${ART[ch.art]}
    <div class="inner">
      <div class="chnum">${ch.title.split("·")[0]}</div>
      <div class="chname">${ch.head}</div>
      <div class="year">${ch.year}</div>
      <div class="hook">${ch.hook}</div>
      <p class="body">${ch.text}</p>
      ${ch.unlock?`<div class="unlock" style="text-align:left">📊 ${ch.unlock}</div>`:""}
      <button class="btn" onclick="nextScene()">Begin Chapter →</button>
    </div></div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}

function nextScene(){
  G.sc++;
  const ch=CHAPTERS[G.ch];
  if(G.sc>=ch.scenes.length){ chapterReport(); return; }
  const s=ch.scenes[G.sc];
  renderKPIs();
  stage.innerHTML=`<div class="card">
    ${ART[s.art]||""}
    <div class="inner">
      <div class="chapter-title">${ch.title} · Scene ${G.sc+1}/${ch.scenes.length}</div>
      <p class="story">${s.story}</p>
      <div class="choices">${s.choices.map((c,i)=>`<button class="choice" onclick="pick(${i})">${c.label}</button>`).join("")}</div>
    </div></div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}

function pick(i){
  const ch=CHAPTERS[G.ch], s=ch.scenes[G.sc], c=s.choices[i];
  const deltas={};
  for(const k in c.fx){
    const isBoard = G.boardActive.includes(k);
    const isFounder = G.founderActive.includes(k);
    if(!isBoard && !isFounder) continue;
    const jitter = Math.abs(c.fx[k])>2 ? Math.floor(Math.random()*3)-1 : 0;
    const scaled = c.fx[k] * (c.fx[k]<0 ? PLAYER.diff.neg : PLAYER.diff.pos);
    const d=Math.round(scaled)+jitter;
    deltas[k]=d;
    if(isBoard) G.board[k]=clamp(G.board[k]+d);
    else G.founder[k]=clamp(G.founder[k]+d);
  }
  G.log.push({chapter:ch.title, choice:c.label});
  renderKPIs(deltas);

  if(G.founder.cash<=0){ gameOver("cash", c); return; }
  if(G.founder.resolve<=0){ gameOver("resolve", c); return; }

  const fxHtml=Object.entries(deltas).map(([k,d])=>{
    const name = FOUNDER_METRICS[k]?FOUNDER_METRICS[k].name : SQDCM.find(t=>t.key===k).name;
    return `<span class="${d>=0?'up':'down'}">${name} ${d>=0?'+':''}${d}</span>`;
  }).join("");
  stage.innerHTML=`<div class="card">
    ${ART[s.art]||""}
    <div class="inner">
      <div class="chapter-title">${ch.title} · Outcome</div>
      <p class="story">${c.outcome}</p>
      <div class="effects">${fxHtml}</div>
      ${s.fact?`<div class="fact"><b>⚙ Forge Fact</b>${s.fact}</div>`:""}
      <button class="btn" onclick="nextScene()">Continue →</button>
    </div></div>`;
}

function chapterReport(){
  const ch=CHAPTERS[G.ch];
  const rows=[];
  const addRow=(name,was,now,color,fmt)=>{
    const d=now-was;
    const dh = was===null ? `<span class="up">NEW</span>` : `<span class="${d>=0?'up':'down'}">${d>=0?'+':''}${d}</span>`;
    rows.push(`<div class="rowm"><span class="mname">${name}</span>
      <div class="dual"><span class="was" style="width:${was===null?0:was}%"></span><span class="now" style="width:${now}%;background:${color};opacity:.85"></span></div>
      <span>${fmt(now)} ${dh}</span></div>`);
  };
  G.founderActive.forEach(k=>{
    const m=FOUNDER_METRICS[k];
    addRow(m.name, G.snap.fActive.includes(k)?G.snap.founder[k]:null, G.founder[k], m.color, m.fmt);
  });
  G.boardActive.forEach(k=>{
    const t=SQDCM.find(t=>t.key===k);
    addRow(t.key+" · "+t.name, G.snap.bActive.includes(k)?G.snap.board[k]:null, G.board[k], "var(--teal)", v=>v);
  });
  // verdict
  const fd=G.founderActive.filter(k=>G.snap.fActive.includes(k)).map(k=>G.founder[k]-G.snap.founder[k]);
  const bd=G.boardActive.filter(k=>G.snap.bActive.includes(k)).map(k=>G.board[k]-G.snap.board[k]);
  const all=[...fd,...bd]; const net=all.reduce((a,b)=>a+b,0);
  const worst=Math.min(...all,0);
  const verdict = net>=15 ? `${PLAYER.name}, the chapter ends stronger than it began. Pawar would call that a good month — and Pawar doesn't say that.`
    : net>=0 ? `You held the line, ${PLAYER.name}. In manufacturing, holding the line while growing is quieter than glory — and rarer.`
    : worst<=-10 ? `A bruising chapter, ${PLAYER.name}. Something gave way back there. The forge remembers — but it also reheats.`
    : `A costly stretch, ${PLAYER.name}. Every founder has chapters they'd rewrite. The next page is still blank.`;
  const isLast = G.ch>=CHAPTERS.length-1;
  stage.innerHTML=`<div class="card report">
    <div class="inner">
      <div class="chapter-title">${ch.title} · Chapter Review</div>
      <h2>Where you started → where you stand</h2>
      <p class="story" style="font-size:12px;color:var(--muted);margin-bottom:6px">Grey bar = start of chapter · coloured bar = now</p>
      ${rows.join("")}
      <p class="verdict">${verdict}</p>
      <button class="btn" onclick="advanceChapter()">${isLast?"See How the Story Ends →":"Open the Next Chapter →"}</button>
    </div></div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}
function advanceChapter(){
  G.ch++; G.sc=-1;
  if(G.ch>=CHAPTERS.length){ ending(); return; }
  showChapterIntro();
}

function gameOver(why, c){
  const msg = why==="cash"
    ? "The account hits zero. The bank's letter is polite and final. You sell the machines to a man who haggles over the lathe Pawar loved. Some dreams end not with a bang but with an auction."
    : "One morning you simply cannot get out of the car in the workshop parking lot. The body keeps score, and yours has called the debt. The shutters come down — not for lack of money, but of fire.";
  stage.innerHTML=`<div class="card gameover">
    ${ART.workshop_gate}
    <div class="inner">
      <h2>■ The Story Ends Here</h2>
      <p class="story">${c.outcome}</p>
      <p class="story"><em>${msg}</em></p>
      <p class="story">But founders are made of restarts.</p>
      <button class="btn" onclick="location.reload()">Begin Again</button>
    </div></div>`;
}

function ending(){
  $("pill").textContent="Epilogue";
  renderKPIs();
  const allVals=[...G.founderActive.map(k=>G.founder[k]), ...G.boardActive.map(k=>G.board[k])];
  const avg=Math.round(allVals.reduce((a,b)=>a+b,0)/allVals.length);
  let title,text;
  if(avg>=72){ title="The Legend of the Forge";
    text="Business schools write the case study. The pigeon-filled workshop is preserved at the Nashik plant entrance — shutters, oil stains and all — with a plaque: <em>“Every great factory was once one person's unreasonable decision.”</em> Your SQDCM boards glow green across continents, but on Friday evenings you still walk a shop floor, picking up a part, feeling the finish, the way Pawar taught you."; }
  else if(avg>=55){ title="The Builder";
    text="Not every battle won, but the war — decisively. A global manufacturer stands where a rusty shutter once hung. People who joined as ITI kids now run plants. Whatever the exit numbers say, the truest balance sheet is this: a few thousand families, three towns, and one industry are different because you got fed up at the right moment."; }
  else { title="The Survivor";
    text="It was harder than the books said and lonelier than anyone warned. The company stands — scarred, real, yours. Some tiles on the board never turned green; some decisions still visit you at 3am. But you built a thing that exists, that employs, that ships. Most people never find out what they would do. You did."; }
  const weak = SQDCM.filter(t=>G.boardActive.includes(t.key)).sort((a,b)=>G.board[a.key]-G.board[b.key])[0];
  stage.innerHTML=`<div class="card">
    ${ART.legacy}
    <div class="inner">
      <div class="chapter-title">Epilogue · ${PLAYER.name} · ${PLAYER.diff.name} mode · Overall ${avg}/100 · Weakest tile: ${weak.name} (${G.board[weak.key]})</div>
      <div class="ending-title">${title}</div>
      <p class="story">${text}</p>
      <h2 style="margin-top:18px">Your Journey</h2>
      <div class="timeline">${G.log.map(l=>`<div class="row"><span class="ch">${l.chapter.split("·")[0]}</span><span>${l.choice}</span></div>`).join("")}</div>
      <button class="btn" onclick="location.reload()">Live It Again</button>
    </div></div>`;
}

renderKPIs();
showOnboarding();
</script>
</body>
</html>
